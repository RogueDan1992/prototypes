<!doctype html><html lang="en"><head><meta name="robots" content="noindex, nofollow"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="NEI Projects"><meta name="theme-color" content="#0d0d0d"></head><body>
<title>NEI Office and Customer Projects</title>
<meta name="description" content="Northeast International office and customer projects, test version">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky header with search, customer strip, summary tiles, group-by switch, then project cards (all customers by default). Tap a card for a bottom-sheet editor with a per-project conversation and @tags. Office view: greeting, two-column dashboard (my plate + requests | project glance, supply list, office board). */
:root{
  --bg:#f3f2ef; --surface:#ffffff; --ink:#1c1b1a; --muted:#6b6862; --line:#e2dfd9;
  --red:#c8102e; --red-soft:#fbe7ea;
  --ok:#2f7d4f; --ok-soft:#e3f2e8; --warn:#a96a00; --warn-soft:#fbf0d9; --late:#c8102e;
  --chip:#efeeea; --note:#f7f5f0;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141312; --surface:#1f1e1c; --ink:#f1efea; --muted:#a29e96; --line:#33312d;
  --red:#ff4d5e; --red-soft:#3a1a1e; --ok:#5cc489; --ok-soft:#183324; --warn:#e3a43a; --warn-soft:#352812; --late:#ff4d5e; --chip:#2a2926; --note:#191816; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1f1e1c; --ink:#f1efea; --muted:#a29e96; --line:#33312d;
  --red:#ff4d5e; --red-soft:#3a1a1e; --ok:#5cc489; --ok-soft:#183324; --warn:#e3a43a; --warn-soft:#352812; --late:#ff4d5e; --chip:#2a2926; --note:#191816; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#0d0d0d;color:#f1efea;padding:12px 16px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:14px;max-width:1200px;margin:0 auto;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:10px;line-height:1}
.mark .bar{width:8px;height:34px;background:#c8102e}
.mark .wm{display:grid;gap:3px}
.mark .wm b{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.06em;text-transform:uppercase}
.mark .wm small{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#a29e96;font-weight:600}
.mark .logo{height:48px;width:auto;display:block;margin:-6px 0 -6px -10px}
.mark .sub{font-family:var(--f-display);font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#a29e96;border-left:1px solid #3a3835;padding-left:12px}
@media (max-width:640px){.mark .logo{height:40px}}
.search{flex:1 1 280px;max-width:460px;position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:12px 40px 12px 14px;border-radius:10px;border:1px solid #3a3835;background:#211f1d;color:#f1efea;min-height:46px}
.search input::placeholder{color:#8f8b84}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#a29e96;font-size:20px;width:36px;height:36px}

main{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:14px 120px;display:grid;gap:18px}
.proto{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.proto b{background:var(--warn-soft);color:var(--warn);padding:2px 8px;border-radius:4px;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em}

.custs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.custs::-webkit-scrollbar{display:none}
.cbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;text-align:left;display:grid;gap:2px;min-height:58px;min-width:140px}
.cbtn .cn{font-weight:600}
.cbtn .cc{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.cbtn .cc em{color:var(--late);font-style:normal;font-weight:600}
.cbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cbtn[aria-pressed="true"] .cc{color:color-mix(in srgb,var(--surface) 70%,transparent)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;display:grid;gap:2px;min-height:80px}
.tile .n{font-family:var(--f-display);font-weight:700;font-size:36px;line-height:1}
.tile .l{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.tile[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tile.alert .n{color:var(--late)}
.tile.zero .n{color:var(--muted)}

.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:8px 14px;min-height:40px;font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.scope{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.scope strong{color:var(--ink)}
.clear{background:var(--chip);border:0;border-radius:999px;padding:7px 12px;min-height:36px;font-weight:500;font-size:13px}

.group h2{font-family:var(--f-display);font-weight:600;font-size:20px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
.group h2 span{font-family:var(--f-mono);font-size:13px;color:var(--muted);letter-spacing:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:grid;gap:10px;min-width:0;align-content:start}
.card:active{transform:scale(.99)}
.card.late{border-left:4px solid var(--late)}
.ctop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cname{min-width:0;display:grid;gap:2px}
.cdate{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ctag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--red)}
.ctitle{font-weight:600;font-size:17px;line-height:1.25}
.pill{flex:none;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--chip);white-space:nowrap}
.pill.s-mid{background:var(--warn-soft);color:var(--warn)}
.pill.s-order{background:var(--ok-soft);color:var(--ok)}
.pill.s-hold{background:var(--line);color:var(--muted)}
.pill.s-info{background:var(--red-soft);color:var(--red)}
.next{font-size:14px;overflow-wrap:anywhere;display:flex;gap:6px}
.next::before{content:"Next";flex:none;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding-top:2px;width:34px}
.next.empty{color:var(--muted);font-style:italic}
.cnote{background:var(--note);border-radius:8px;padding:8px 10px;font-size:13.5px;color:var(--ink);display:grid;gap:3px;overflow-wrap:anywhere}
.cnote .nd{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.cnote .nt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cnote .more{font-size:11px;color:var(--muted)}
.cmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.fu{font-family:var(--f-mono)}
.fu.late{color:var(--late);font-weight:600}
.track{display:flex;gap:4px;align-items:center}
.track i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.track i.on{background:var(--ok)}
.track i.na{background:transparent;border:1px dashed var(--line)}

.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--red);color:#fff;border:0;border-radius:999px;padding:14px 22px;font-weight:600;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.25);min-height:52px;z-index:6}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--surface);border-radius:18px 18px 0 0;max-height:92%;overflow:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 10px}
.shead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:6px}
.shead h3{margin:0;font-size:20px;line-height:1.25}
.x{background:var(--chip);border:0;border-radius:999px;width:40px;height:40px;flex:none;font-size:20px}
.field{display:grid;gap:8px;margin-top:18px}
.flabel{font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 14px;min-height:44px;font-weight:500}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:52px;text-align:left;display:flex;gap:10px;align-items:center;font-weight:500}
.steps button .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;color:#fff}
.steps button[data-v="Yes"] .box{background:var(--ok);border-color:var(--ok)}
.steps button[data-v="N/A"]{color:var(--muted)}
.steps button[data-v="N/A"] .box{border-style:dashed}
input[type=text],input[type=date],input[type=url],input[type=search],textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:48px}
textarea{min-height:70px;resize:vertical}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick button{background:var(--chip);border:0;border-radius:8px;padding:8px 12px;min-height:40px;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.notebox{display:grid;gap:8px}
.addnote{display:flex;gap:8px;align-items:flex-end}
.addnote textarea{flex:1;min-height:52px}
.addnote button{flex:none;background:var(--ink);color:var(--surface);border:0;border-radius:10px;padding:0 18px;min-height:52px;font-weight:600}
.nlog{display:grid;gap:8px;max-height:260px;overflow:auto}
.nlog .ne{background:var(--note);border-radius:8px;padding:10px 12px;display:grid;gap:4px}
.nlog .nh{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.nlog .nh button{border:0;background:transparent;color:var(--muted);font-size:12px;padding:0 4px}
.nlog .nb{font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:14px 20px;min-height:52px;font-weight:600;font-size:16px}
.btn.primary{background:var(--red);color:#fff;flex:1}
.btn.ghost{background:var(--chip)}
.folder{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--red);text-decoration:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.who button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:36px;font-size:13px;font-weight:500}
.who button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.toprow{display:flex;justify-content:space-between;gap:10px 18px;align-items:center;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);flex:none}
.cnote .nd{display:flex;align-items:center;gap:6px}
.cnote .who-says{font-weight:600;color:var(--ink);font-family:var(--f-body)}
.thread{display:grid;gap:10px;max-height:340px;overflow:auto;padding:4px 2px;background:var(--bg);border-radius:12px;padding:12px}
.msg{display:grid;gap:3px;max-width:86%;justify-self:start}
.msg.mine{justify-self:end}
.msg .mh{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:baseline}
.msg.mine .mh{justify-content:flex-end}
.msg .mh b{color:var(--ink);font-weight:600}
.msg .mb{background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:9px 12px;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.mine .mb{background:var(--ink);color:var(--surface);border-color:var(--ink);border-radius:14px 4px 14px 14px}
.msg.legacy .mb{background:var(--note);border-style:dashed}
.mention{font-weight:600;color:var(--red)}
.msg.mine .mention{color:#ff8a96}
.msg .sent{font-size:11.5px;color:var(--muted);display:flex;gap:4px;align-items:center}
.msg.mine .sent{justify-content:flex-end}
.compose{display:grid;gap:8px;margin-top:10px;position:relative}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.tagrow button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:36px;font-size:13px;font-weight:500}
.cbox{display:flex;gap:8px;align-items:flex-end}
.cbox textarea{flex:1;min-height:52px}
.cbox .send{flex:none;background:var(--red);color:#fff;border:0;border-radius:10px;padding:0 18px;min-height:52px;font-weight:600}
.suggest{position:absolute;left:0;bottom:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;display:grid;gap:2px;min-width:200px;z-index:2}
.suggest button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:8px;min-height:44px;font-weight:500}
.suggest button:hover,.suggest button:focus-visible{background:var(--chip)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:transparent;padding:12px 14px 11px;min-height:48px;font-weight:600;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.tabs button span{font-family:var(--f-mono);font-size:12px;font-weight:500;background:var(--chip);border-radius:999px;padding:2px 8px;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
.tabs button[aria-selected="true"] span{background:var(--ink);color:var(--surface)}
.card{cursor:pointer}
.cfolder{font-size:13px;font-weight:600;color:var(--red);text-decoration:none;padding:6px 10px;margin:-6px -6px -6px 0;border-radius:8px;white-space:nowrap}
.cfolder:hover{background:var(--red-soft)}
.cright{display:flex;gap:10px;align-items:center}
.sfolder{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sfolder a{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;text-decoration:none;font-weight:600;border-radius:10px;padding:10px 16px;min-height:44px}
.mimg{display:block;max-width:220px;width:100%;border-radius:10px;margin:2px 0;cursor:zoom-in}
.pic{flex:none;display:grid;place-items:center;width:52px;min-height:52px;border-radius:10px;background:var(--chip);cursor:pointer}
.pic svg{width:24px;height:24px;stroke:var(--ink)}
.pending{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.pending img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.pending button{border:0;background:var(--chip);border-radius:8px;padding:6px 10px;min-height:36px;font-size:13px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:30;display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.cbtn.addc{border-style:dashed;color:var(--muted);display:grid;place-items:center;min-width:120px;font-weight:600}
.aibtn{display:inline-flex;align-items:center;gap:8px;border:1px solid #3a3835;background:#211f1d;color:#f1efea;border-radius:10px;padding:0 14px;min-height:46px;font-weight:600}
.aibtn svg{width:18px;height:18px;stroke:#ff6b78}
.hright{display:flex;gap:10px;align-items:center;flex:1 1 320px;justify-content:flex-end;max-width:560px}
.hright .search{flex:1}
.ai{position:fixed;z-index:12;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.18);display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ai-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ai-head h3{margin:0;font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.ai-head small{display:block;color:var(--muted);font-size:12px}
.ai-log{overflow:auto;padding:16px;display:grid;gap:12px;align-content:start}
.ai-msg{max-width:92%;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}
.ai-msg.u{justify-self:end;background:var(--ink);color:var(--surface);border-radius:14px 4px 14px 14px;padding:9px 12px}
.ai-msg.a{justify-self:start;background:var(--bg);border-radius:4px 14px 14px 14px;padding:10px 12px}
.ai-msg.a.thinking{color:var(--muted);font-style:italic}
.ai-act{justify-self:start;font-size:13px;display:flex;gap:8px;align-items:center;background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:6px 10px;flex-wrap:wrap}
.ai-act button{border:0;background:transparent;color:inherit;text-decoration:underline;font-size:13px;padding:0}
.ai-act.undone{background:var(--chip);color:var(--muted)}
.ai-sugg{display:flex;flex-wrap:wrap;gap:8px}
.ai-sugg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;min-height:40px;font-size:13.5px;text-align:left}
.ai-foot{border-top:1px solid var(--line);padding:12px 16px;display:grid;gap:8px}
.ai-foot .cbox textarea{min-height:48px}
.ai-note{font-size:12px;color:var(--muted)}
.appnav{display:flex;gap:4px;background:#1f1e1c;border-radius:10px;padding:4px}
.appnav button{border:0;background:transparent;color:#c9c6bf;border-radius:7px;padding:8px 16px;min-height:40px;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.05em;text-transform:uppercase}
@media (max-width:640px){.appnav{width:100%}.appnav button{flex:1;font-size:15px;padding:8px 10px}}
.appnav button[aria-pressed="true"]{background:#f1efea;color:#141312}
.o-hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.o-hello h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.o-hello p{margin:4px 0 0;color:var(--muted);font-size:14px}
.o-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.o-grid{grid-template-columns:1fr}}
.o-col{display:grid;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ph h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:20px;text-transform:uppercase;letter-spacing:.04em;display:flex;gap:10px;align-items:baseline}
.ph h2 span{font-family:var(--f-mono);font-size:13px;color:var(--muted);letter-spacing:0}
.ph .note{font-size:12.5px;color:var(--muted)}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:36px;font-size:13px;font-weight:500}
.fchips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.reqs{display:grid;gap:8px}
.req{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);cursor:pointer;min-height:60px}
.req:active{transform:scale(.995)}
.req.late{border-left:4px solid var(--late)}
.req.done{opacity:.55}
.req.done .rq-t{text-decoration:line-through}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;font-size:15px;color:transparent}
.chk:hover{border-color:var(--ok)}
.req.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.rq-main{flex:1;min-width:0;display:grid;gap:3px}
.rq-t{font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.rq-m{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rq-m .late{color:var(--late);font-weight:600}
.cat{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink)}
.cat.travel{background:#e6eefb;color:#2c5fb3}.cat.supplies{background:var(--warn-soft);color:var(--warn)}.cat.it{background:var(--ok-soft);color:var(--ok)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cat.travel{background:#18243a;color:#7aa7f0}}
:root[data-theme="dark"] .cat.travel{background:#18243a;color:#7aa7f0}
.ex{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.avt{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--chip);color:var(--ink)}
.avt.me{background:var(--ink);color:var(--surface)}
.glance{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gl{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;display:grid;gap:2px;min-height:70px}
.gl .n{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1}
.gl .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.gl.alert .n{color:var(--late)}
.gl.zero .n{color:var(--muted)}
.addrow{display:flex;gap:8px}
.addrow input[type=text]{flex:1;min-width:0}
.addrow input[type=number]{width:72px;font:inherit;font-size:16px;padding:12px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:48px;text-align:center}
.addrow button{flex:none;background:var(--ink);color:var(--surface);border:0;border-radius:10px;padding:0 16px;min-height:48px;font-weight:600}
.sups{display:grid}
.sup{display:flex;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);min-height:52px}
.sup:last-child{border-bottom:0}
.sup .chk{width:26px;height:26px;font-size:13px}
.sup.got .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.sup.got .s-name{text-decoration:line-through;color:var(--muted)}
.s-main{flex:1;min-width:0;display:grid}
.s-name{font-weight:500;overflow-wrap:anywhere}
.s-by{font-size:12px;color:var(--muted)}
.s-qty{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.s-x{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:17px}
.supadd{display:grid;gap:8px}
.s-sub{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.s-sub a{color:var(--red);font-weight:600;text-decoration:none}
.s-note{font-size:13px;color:var(--ink2,var(--ink));background:var(--note);border-radius:6px;padding:4px 8px;margin-top:4px;overflow-wrap:anywhere}
.s-name{cursor:pointer}
.appr{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;min-height:34px;font-size:12px;font-weight:600;color:var(--warn)}
.appr.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.appbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.appbox .state{font-size:14px}
.appbox .state.ok{color:var(--ok);font-weight:600}
.appbox .state.wait{color:var(--warn);font-weight:600}
.appbox button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;min-height:44px;font-weight:600}
.appbox button.go{background:var(--ok);border-color:var(--ok);color:#fff}
.linkbtn{border:0;background:transparent;color:var(--red);font-weight:600;font-size:13px;padding:6px 4px}
.posts{display:grid;gap:10px}
.post{display:flex;gap:10px;align-items:flex-start}
.post .pb{flex:1;min-width:0;background:var(--note);border-radius:4px 12px 12px 12px;padding:9px 12px;display:grid;gap:3px}
.post .pm{font-size:12px;color:var(--muted)}
.post .pm b{color:var(--ink)}
.post .pt{font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.del2{border:0;background:var(--chip);color:var(--muted);border-radius:12px;padding:14px 16px;min-height:52px;font-weight:600}
.del2.arm{background:var(--red);color:#fff}
.login{position:fixed;inset:0;z-index:60;background:#0d0d0d;display:grid;place-items:center;padding:24px 16px;overflow:auto}
.lbox{width:min(420px,100%);background:var(--surface);border-radius:16px;padding:24px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lbox .llogo{background:#0d0d0d;border-radius:10px;padding:6px 10px;justify-self:start}
.lbox .llogo img{height:44px;display:block}
.lbox h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.03em}
.lbox p{margin:0;color:var(--muted);font-size:14px}
.lbox p.err{color:var(--red);font-weight:500}
.lbox label{display:grid;gap:6px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.lbox input{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:48px}
.lbox .btn.primary{width:100%}
.lbox .btn.ms{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:12px;min-height:52px;font-weight:600;font-size:16px}
.lor{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px}
.lor::before,.lor::after{content:"";flex:1;height:1px;background:var(--line)}
.who button{margin-left:6px}
.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-left:8px;vertical-align:1px}
.syncdot.busy{background:var(--warn)}.syncdot.off{background:var(--red)}
.empty-state{color:var(--muted);padding:24px;border:1px dashed var(--line);border-radius:12px;text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<script>
const TODAY=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const STATUSES = ["New Request","Quoting","Quote Sent","Samples","Ready to Order","Needs Info","Order Placed","In Production","Ready to Ship","Shipped","Delivered","On Hold","Completed","Dead"];
const STEPS = ["Factory Quote","Quote Sent","Sample Approved","Order Placed","Shipped","Delivered"];
const ACTIVE = ["New Request","Quoting","Quote Sent","Samples","Ready to Order","Needs Info"];
const OPEN_ORDER = ["Order Placed","In Production","Ready to Ship","Shipped"];
const CLOSED = ["Delivered","Completed","Dead"];
const TABS=[["progress","In progress",s=>!CLOSED.includes(s)&&!OPEN_ORDER.includes(s)],["ordered","Ordered",s=>OPEN_ORDER.includes(s)],["completed","Completed",s=>s==="Delivered"||s==="Completed"],["dead","Dead",s=>s==="Dead"]];
const tabOf=s=>TABS.find(t=>t[2](s))[0];
const STAGE_GROUPS = [["Getting quotes",["New Request","Quoting","Needs Info"]],["Quoted, waiting on decision",["Quote Sent","Samples","Ready to Order"]],["On hold",["On Hold"]],["Order placed",["Order Placed"]],["In production",["In Production"]],["Ready to ship",["Ready to Ship"]],["Shipped",["Shipped"]],["Delivered",["Delivered"]],["Completed",["Completed"]],["Dead",["Dead"]]];
const LANES = ["NEI D Lapp","NEI D Glick","Factory","Customer","Freight","Nobody"];
const LANE_LABEL = {"NEI D Lapp":"Waiting on Lapp D","NEI D Glick":"Waiting on D Glick","Factory":"Waiting on factory","Customer":"Waiting on customer","Freight":"Waiting on freight","Nobody":"Not waiting on anyone"};
const pillClass = s => ["Order Placed","In Production","Ready to Ship","Shipped","Delivered","Completed"].includes(s)?"s-order":["Quote Sent","Samples","Ready to Order","Quoting"].includes(s)?"s-mid":["On Hold","Dead"].includes(s)?"s-hold":s==="Needs Info"?"s-info":"";

const uid=()=>(window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const TEAM=["D Lapp","D Glick","Kristen","Patty"];
const TEAM_LABEL={"D Lapp":"Lapp D","D Glick":"Daniel G","Kristen":"Kristin","Patty":"Patty"};
function P(customer,name,vendor,status,waiting,next,fu,steps,note){
  const m={Y:"Yes",N:"No",A:"N/A","-":""};
  const st=Object.fromEntries(STEPS.map((s,i)=>[s,m[steps[i]]]));
  return {id:uid(),customer,name,vendor,status,waiting,next,fu,folder:"",steps:st,
    notes: note?[{id:uid(),at:"",by:"",text:note,mentions:[],seen:[]}]:[]};
}

const KEY="nei-hub-prefs-v1";
let prefs={}; try{ prefs=JSON.parse(localStorage.getItem(KEY))||{} }catch(e){}
let state={projects:[],customers:[],custInfo:{},office:{tasks:[],supplies:[],posts:[]},me:null,tab:prefs.tab||"progress",view:prefs.view||"office",groupBy:prefs.groupBy||"waiting"};
const OCATS=["Travel","Office supplies","Office","IT","Other"];
const catCls=c=>({"Travel":"travel","Office supplies":"supplies","IT":"it"}[c]||"");
let officeCat="All";
let custFilter=null, tileFilter=null, query="";
const save=()=>{ try{localStorage.setItem(KEY,JSON.stringify({tab:state.tab,view:state.view,groupBy:state.groupBy}))}catch(e){} queueSync(); };

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isOpen=p=>!CLOSED.includes(p.status);
const isLate=p=>p.fu && isOpen(p) && new Date(p.fu+"T00:00")<=TODAY;
const fmt=d=>{ if(!d) return ""; const x=new Date(d+"T00:00"); return (x.getMonth()+1)+"/"+x.getDate() };
const split=n=>{ const m=n.match(/^(\d{4}-\d{2}-\d{2})\s+(.*)$/); return m?[m[1],m[2]]:["",n] };
const unseenFor=(p,who)=>p.notes.filter(m=>m.mentions.includes(who)&&!m.seen.includes(who)&&m.by!==who).length;
const whenTxt=at=>{ if(!at) return "From tracker"; const d=new Date(at); const sameDay=d.toDateString()===new Date().toDateString(); const t=d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}); return sameDay?t:(d.getMonth()+1)+"/"+d.getDate()+" "+t; };
const mentionHTML=t=>{ let h=esc(t); TEAM.forEach(n=>{ h=h.split("@"+esc(n)).join('<span class="mention">@'+esc(TEAM_LABEL[n])+'</span>'); }); return h; };
const parseMentions=t=>TEAM.filter(n=>t.includes("@"+n));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

function scoped(){
  let ps=state.projects;
  if(custFilter) ps=ps.filter(p=>p.customer===custFilter);
  if(query){ const q=query.toLowerCase(); ps=ps.filter(p=>(p.customer+" "+p.name+" "+p.vendor+" "+p.next+" "+p.notes.map(n=>n.text).join(" ")).toLowerCase().includes(q)); }
  return ps;
}

function renderCusts(){
  const q=query.toLowerCase();
  const list=state.customers.filter(c=>!q || c.toLowerCase().includes(q) || state.projects.some(p=>p.customer===c && (p.name+" "+p.vendor).toLowerCase().includes(q)));
  const stat=c=>{ const ps=state.projects.filter(p=>(!c||p.customer===c)); const ip=ps.filter(p=>tabOf(p.status)==="progress").length, od=ps.filter(p=>tabOf(p.status)==="ordered").length, d=ps.filter(isLate).length; return `${ip} in progress · ${od} ordered${d?` · <em>${d} due</em>`:""}`; };
  $("#custs").innerHTML=`<button class="cbtn" aria-pressed="${!custFilter}" data-c=""><span class="cn">All customers</span><span class="cc">${stat(null)}</span></button>`+
    list.map(c=>`<button class="cbtn" aria-pressed="${custFilter===c}" data-c="${esc(c)}"><span class="cn">${esc(c)}</span><span class="cc">${stat(c)}</span></button>`).join("")+
    `<button class="cbtn addc" id="addCust">+ Add customer</button>`;
}
function renderTiles(){
  const all=scoped();
  $("#tabs").innerHTML=TABS.map(([k,l,f])=>`<button role="tab" data-tab="${k}" aria-selected="${!tileFilter&&state.tab===k}">${l}<span>${all.filter(p=>f(p.status)).length}</span></button>`).join("");
  const ps=all.filter(isOpen);
  const t=[
    {k:"late",l:"Follow-ups due",n:ps.filter(isLate).length,alert:true},
    {k:"tagged",l:"Tagged you",n:ps.filter(p=>unseenFor(p,state.me)).length,alert:true},

  const sendMsg=()=>{ const t=box.value.trim(); if(!t&&!pendImg) return; const mentions=parseMentions(t);

    pendImg=null; showPend();

  box.addEventListener("input",()=>{ const m=box.value.match(/@([\w]{0,10})$/); if(!m){ sug.hidden=true; return; }

  $("#steps").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const nx={"No":"Yes","":"Yes","Yes":"N/A","N/A":"No"}[b.dataset.v];b.dataset.v=nx;b.querySelector(".box").textContent=nx==="Yes"?"✓":"";draft.steps[b.dataset.s]=nx;});
  host.querySelectorAll("[data-q]").forEach(b=>b.addEventListener("click",()=>{$("#fFu").value=+b.dataset.q?plus(+b.dataset.q):""}));
  const close=()=>host.innerHTML="";
  $("#close").onclick=$("#cancel").onclick=$("#scrim").onclick=close;

function addCustomer(name,code,folder){
  name=String(name||"").trim(); if(!name) throw new Error("Customer name is empty");

  state.customers.push(name); state.custInfo[name]={code:String(code||"").trim().toUpperCase(),folder:String(folder||"").trim()}; save(); render(); return name;
}

function drawAI(){
  const log=$("#aiLog"); if(!log) return;
  log.innerHTML=aiTurns.length?aiTurns.map(t=>`<div class="ai-msg ${t.role==="user"?"u":"a"}">${esc(t.content)}</div>`).join(""):
   `<div class="ai-msg a">Hi ${esc(TEAM_LABEL[state.me])}. I can answer questions about projects and office requests, update statuses and follow-ups, assign requests, add to the supply list, post updates and tag people.</div>

async function askAI(q){
  q=String(q||"").trim(); if(!q||!sampleFn) return;
  if(aiBusy){ toast("Still working on the last one"); return; }
  $("#aiBox").value="";
  aiTurns.push({role:"user",content:q}); drawAI();
  const log=$("#aiLog"); log.insertAdjacentHTML("beforeend",`<div class="ai-msg a thinking" id="aiLive">Thinking...</div>`); log.scrollTop=log.scrollHeight;
  aiBusy=new AbortController(); $("#aiSend").textContent="Stop"; $("#aiSend").onclick=()=>aiBusy?.abort();
  const turns=[{role:"user",content:aiRules()},...aiTurns.slice(-12)];
  try{
    const {text}=await sampleFn(turns,{cache:false,signal:aiBusy.signal,tools:AI_TOOLS,
      onText:({text})=>{ const el=$("#aiLive"); if(el){ el.classList.remove("thinking"); el.textContent=text; $("#aiLog").scrollTop=1e9; } }});
    aiTurns.push({role:"assistant",content:text});
  }catch(e){
    const msg={cancelled:"Stopped.",not_granted:"The assistant needs your OK to use your Claude account. Close and reopen it to try again.",rate_limited:"Too many requests right now. Try again in a minute.",session_expired:"Please sign in to Claude again.",tools_unavailable:"This app version can't let the assistant make changes. Questions still work if you ask again."}[e?.code]||"Something went wrong. Try asking again.";
    if(e?.text) aiTurns.push({role:"assistant",content:e.text});
    aiTurns.push({role:"assistant",content:msg});
    if(e?.code==="not_granted"||e?.code==="sampling_disabled"){ $("#aiOpen").hidden=true; }
  }finally{
    aiBusy=null; const live=$("#aiLive"); if(live) live.remove();
    const acts=[...document.querySelectorAll(".ai-act")].map(a=>a.outerHTML).join("");
    drawAI(); if(acts&&$("#aiLog")) { $("#aiLog").insertAdjacentHTML("beforeend",acts); $("#aiLog").scrollTop=1e9; }
    if($("#aiSend")){ $("#aiSend").textContent="Send"; $("#aiSend").onclick=()=>askAI($("#aiBox").value); }
  }
}

document.addEventListener("click",e=>{
  const vw=e.target.closest("[data-view]"); if(vw){ state.view=vw.dataset.view; save(); render(); window.scrollTo(0,0); return; }
  const dn=e.target.closest("[data-done]"); if(dn){ const t=state.office.tasks.find(x=>x.id===dn.dataset.done); t.status=t.status==="Done"?"Open":"Done"; save(); render(); toast(t.status==="Done"?"Marked done":"Reopened"); return; }
  const rq=e.target.closest("[data-req]"); if(rq){ openReq(state.office.tasks.find(x=>x.id===rq.dataset.req),false); return; }
  const oc=e.target.closest("[data-ocat]"); if(oc){ officeCat=oc.dataset.ocat; render(); return; }
  const gl=e.target.closest("[data-glance]"); if(gl){ const k=gl.dataset.glance; state.view="projects"; custFilter=null; query="";
    if(k==="mine"){ const ln=LANE_OF[state.me]; tileFilter=ln?"w:"+ln:null; } else if(k==="orders"){ tileFilter=null; state.tab="ordered"; } else tileFilter=k;
    save(); render(); window.scrollTo(0,0); return; }
  const gt=e.target.closest("[data-got]"); if(gt){ const x=state.office.supplies.find(y=>y.id===gt.dataset.got); x.got=!x.got; save(); render(); return; }
  const es=e.target.closest("[data-esup]"); if(es){ openSup(state.office.supplies.find(y=>y.id===es.dataset.esup)); return; }
  const rs=e.target.closest("[data-rmsup]"); if(rs){ state.office.supplies=state.office.supplies.filter(y=>y.id!==rs.dataset.rmsup); save(); render(); return; }

  if(e.target.closest("#aiOpen")){ openAI(); return; }

  const ud=e.target.closest("[data-undo]"); if(ud){ const u=aiUndo.find(x=>x.id===ud.dataset.undo); if(u){ u.undo(); aiUndo=aiUndo.filter(x=>x!==u); save(); render(); const row=ud.closest(".ai-act"); row.classList.add("undone"); row.innerHTML="<span>Undone</span>"; } return; }
  if(e.target.id==="addCust"){ openCustSheet(); return; }
  const w=e.target.closest("[data-me]"); if(w){ state.me=w.dataset.me; save(); render(); toast("Viewing as "+TEAM_LABEL[state.me]); return; }
  const z=e.target.closest("[data-zoom]"); if(z){ $("#toastHost").insertAdjacentHTML("beforeend",`<div class="lightbox" id="lb"><img src="${z.src}" alt=""></div>`); return; }
  if(e.target.closest("#lb")){ $("#lb").remove(); return; }
  if(e.target.closest(".cfolder")) return;
  const tb=e.target.closest("[data-tab]"); if(tb){ state.tab=tb.dataset.tab; tileFilter=null; save(); render(); return; }
  const c=e.target.closest(".cbtn"); if(c){ custFilter=c.dataset.c||null; render(); return; }
  const t=e.target.closest(".tile"); if(t){ tileFilter=tileFilter===t.dataset.f?null:t.dataset.f; render(); return; }
  const g=e.target.closest("[data-g]"); if(g){ state.groupBy=g.dataset.g; save(); render(); return; }
  if(e.target.id==="reset"){ custFilter=null; tileFilter=null; query=""; $("#q").value=""; render(); return; }
  if(e.target.id==="qclr"){ query=""; $("#q").value=""; render(); return; }
  const card=e.target.closest(".card"); if(card){ openSheet(state.projects.find(p=>p.id===card.dataset.id)); return; }
  if(e.target.id==="add"){ openSheet({id:uid(),customer:custFilter||"",name:"",vendor:"",status:"New Request",waiting:"NEI D Lapp",next:"",fu:"",notes:[],folder:"",steps:Object.fromEntries(STEPS.map(s=>[s,"No"]))},true); }
});

const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlZ2Rnd2ZucnR6bnlmbXh0d3F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5NDg0OTIsImV4cCI6MjEwNzUyNDQ5Mn0.cIhT4-LMiMbGtz9HbVJCwUrI1deZSFYXq9y6c3NFRug";
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const TABLES=["customers","projects","messages","office_tasks","supplies","posts"];
const PK={customers:"name"};
let last=null, syncChain=Promise.resolve(), pendingRender=false;
function toRows(){
  const P=state.projects;
  return {
    customers:state.customers.map(n=>({name:n,code:state.custInfo[n]?.code||"",folder:state.custInfo[n]?.folder||""})),
    projects:P.map(p=>({id:p.id,customer:p.customer,name:p.name,vendor:p.vendor||"",status:p.status,waiting:p.waiting,next:p.next||"",fu:p.fu||null,folder:p.folder||"",steps:p.steps||{}})),
    messages:P.flatMap(p=>p.notes.map(m=>({id:m.id,project_id:p.id,author:m.by||"",at:m.at||null,body:m.text||"",mentions:m.mentions||[],seen:m.seen||[],img:m.img||null}))),
    office_tasks:state.office.tasks.map(t=>({id:t.id,title:t.title,cat:t.cat,assigned_to:t.to,assigned_by:t.from||"",due:t.due||null,status:t.status,details:t.details||"",comments:t.comments||[]})),
    supplies:state.office.supplies.map(x=>({id:x.id,item:x.item,qty:x.qty||1,added_by:x.by||"",got:!!x.got,link:x.link||"",note:x.note||""})),
    posts:state.office.posts.map(x=>({id:x.id,author:x.by,at:x.at,body:x.text,mentions:x.mentions||[]}))
  };
}
const snap=rows=>Object.fromEntries(TABLES.map(t=>[t,new Map(rows[t].map(r=>[r[PK[t]||"id"],JSON.stringify(r)]))]));
function setDot(c){ const d=$("#syncdot"); if(d) d.className="syncdot "+(c||""); }
async function doSync(){
  if(!last) return;
  const cur=toRows(); setDot("busy");
  for(const t of TABLES){ const k=PK[t]||"id"; const ups=cur[t].filter(r=>last[t].get(r[k])!==JSON.stringify(r));
    if(ups.length){ const {error}=await sb.from(t).upsert(ups,{onConflict:k}); if(error) throw error; ups.forEach(r=>last[t].set(r[k],JSON.stringify(r))); } }
  for(const t of [...TABLES].reverse()){ const k=PK[t]||"id"; const ids=new Set(cur[t].map(r=>r[k])); const del=[...last[t].keys()].filter(x=>!ids.has(x));
    if(del.length){ const {error}=await sb.from(t).delete().in(k,del); if(error) throw error; del.forEach(x=>last[t].delete(x)); } }
  setDot("");
}
function queueSync(){ syncChain=syncChain.then(doSync).catch(e=>{ console.error(e); setDot("off"); toast("Couldn't save that change. Check your connection and try again."); }); return syncChain; }
async function loadAll(){
  const res=await Promise.all(TABLES.map(t=>sb.from(t).select("*").order(t==="customers"||t==="messages"||t==="supplies"||t==="office_tasks"?"created_at":t==="posts"?"at":"name")));
  const bad=res.find(r=>r.error); if(bad) throw bad.error;
  const [c,p,m,o,s,po]=res.map(r=>r.data);
  state.customers=c.map(r=>r.name); state.custInfo=Object.fromEntries(c.map(r=>[r.name,{code:r.code,folder:r.folder}]));
  const byId={};
  state.projects=p.map(r=>byId[r.id]={id:r.id,customer:r.customer,name:r.name,vendor:r.vendor,status:r.status,waiting:r.waiting,next:r.next,fu:r.fu||"",folder:r.folder,steps:r.steps||{},notes:[]});
  m.forEach(r=>{ const pr=byId[r.project_id]; if(pr) pr.notes.push({id:r.id,at:r.at||"",by:r.author,text:r.body,mentions:r.mentions||[],seen:r.seen||[],...(r.img?{img:r.img}:{})}); });
  state.office.tasks=o.map(r=>({id:r.id,title:r.title,cat:r.cat,to:r.assigned_to,from:r.assigned_by,due:r.due||"",status:r.status,details:r.details,comments:r.comments||[]}));
  state.office.supplies=s.map(r=>({id:r.id,item:r.item,qty:r.qty,by:r.added_by,got:r.got,link:r.link,note:r.note}));
  state.office.posts=po.map(r=>({id:r.id,by:r.author,at:r.at,text:r.body,mentions:r.mentions||[]}));
  last=snap(toRows());
  safeRender();
}
function safeRender(){ const a=document.activeElement; if(a&&/INPUT|TEXTAREA/.test(a.tagName)&&a.closest("main")){ pendingRender=true; return; } pendingRender=false; render(); }
document.addEventListener("focusout",()=>{ if(pendingRender) setTimeout(()=>{ if(pendingRender) safeRender(); },50); });
let reloadT=null;
function scheduleReload(){ clearTimeout(reloadT); reloadT=setTimeout(async()=>{ await syncChain; try{ await loadAll(); }catch(e){ console.error(e); } },600); }
function subscribe(){ sb.channel("hub").on("postgres_changes",{event:"*",schema:"public"},scheduleReload).subscribe(); }

const MS_LOGIN=false; // flips on once the Microsoft (Azure) connection is set up in Supabase
let lMode="in";

function showLogin(msg,err){ $("#lLogo").src=document.querySelector(".mark img").src; $("#login").hidden=false; if(msg){ $("#lMsg").textContent=msg; $("#lMsg").className=err?"err":""; } }
function setMode(m){ lMode=m; $("#lTitle").textContent=m==="in"?"Sign in":"Create your login"; $("#lGo").textContent=m==="in"?"Sign in":"Create login"; $("#lMode").textContent=m==="in"?"First time here? Create your login":"Already have a login? Sign in"; $("#lPass").autocomplete=m==="in"?"current-password":"new-password"; $("#lMsg").className=""; $("#lMsg").textContent=m==="in"?"Use your Northeast email.":"Use your Northeast email and pick a password (6+ characters)."; }
$("#lMode").onclick=()=>setMode(lMode==="in"?"up":"in");
$("#lForm").addEventListener("submit",async e=>{ e.preventDefault(); const email=$("#lEmail").value.trim(), password=$("#lPass").value;
  $("#lGo").disabled=true; $("#lGo").textContent="One moment...";
  try{
    if(lMode==="up"){ const {data,error}=await sb.auth.signUp({email,password}); if(error) throw error;
      if(!data.session){ showLogin("Your login was created, but Supabase is asking to confirm the email first. Ask Lapp D to turn off email confirmation, then sign in.",true); setMode("in"); return; } }
    else { const {error}=await sb.auth.signInWithPassword({email,password}); if(error) throw error; }
    await afterLogin();
  }catch(err){ const m=String(err.message||err); showLogin(/Invalid login/i.test(m)?"That email and password don't match. First time? Tap Create your login.":/already registered/i.test(m)?"You already have a login. Sign in instead.":m,true); }
  finally{ $("#lGo").disabled=false; $("#lGo").textContent=lMode==="in"?"Sign in":"Create login"; }
});
async function afterLogin(){
  const {data:me,error}=await sb.rpc("my_member");
  if(error||!me){ await sb.auth.signOut(); showLogin("That email isn't on the team list yet. Ask Lapp D to add you.",true); return; }
  state.me=me; $("#login").hidden=true;
  try{ await loadAll(); }catch(e){ console.error(e); toast("Couldn't load the projects. Check your connection."); }
  subscribe();
}
