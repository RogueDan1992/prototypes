<!doctype html><html lang="en"><head><meta name="robots" content="noindex, nofollow"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="theme-color" content="#0d0d0d"><link rel="icon" type="image/png" sizes="64x64" href="favicon.png"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
<title>NEI Office and Customer Projects</title>
<meta name="description" content="Northeast International office and customer projects">
<meta name="apple-mobile-web-app-title" content="NEI Hub">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header with search, customer strip, summary tiles, group-by switch, then project cards (all customers by default). Tap a card for a bottom-sheet editor with a per-project conversation and @tags. Office view: greeting, two-column dashboard (my plate + requests | project glance, supply list, office board). */
:root{
  --bg:#f3f2ef; --surface:#ffffff; --ink:#1c1b1a; --muted:#6b6862; --line:#e2dfd9;
  --red:#C42A18; --red-soft:#fcebe8;
  --ok:#276b43; --ok-soft:#e3f2e8; --warn:#8a5600; --warn-soft:#fbf0d9; --late:#C42A18;
  --chip:#efeeea; --note:#f7f5f0;
  --red-fill:#C42A18; --on-red:#fff;
  /* One job per color: black = things you press; red = needs you now (past due, tagged you); amber = due soon; green = done or in progress.
     --act/--on-act are the main-button colors (they follow --ink, so they flip in dark mode). */
  --act:var(--ink); --on-act:var(--surface); --amber:#e0a52b;
  --go:#1d5a3a; --go-fill:#1d5a3a; --on-go:#fff; --go-soft:#e4efe8; --go-line:#9cc4ad; --on-ok:#fff; --info:#2c5fb3; --info-soft:#e6eefb; --mention-on-ink:#8fdcae;
  /* the header is always dark, in both themes */
  --hdr-bg:#0d0d0d; --hdr-fg:#f1efea; --hdr-muted:#a29e96; --hdr-dim:#8f8b84; --hdr-line:#3a3835; --hdr-field:#211f1d; --hdr-nav:#1f1e1c; --hdr-navfg:#c9c6bf; --hdr-accent:#f1efea; --brand:#E23B28;
  /* type: 6 steps, plus 16px for fields and big buttons (stops iPad zooming in) */
  --fs-xs:12px; --fs-sm:13px; --fs-md:15px; --fs-input:16px; --fs-lg:17px; --fs-xl:22px; --fs-2xl:30px;
  /* NEI brand: square corners everywhere and no drop shadows. The names stay so one edit here can change the look. */
  --r-sm:0; --r-md:0; --r-lg:0; --r-pill:0;
  /* a raised or floating surface gets a crisp outline instead of a shadow */
  --sh-raised:0 0 0 1px var(--line); --sh-float:0 0 0 1px var(--ink);
  --ls-caps:.07em; --ls-display:.04em;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  /* one family, as the NEI brand kit sets for web: Source Sans 3 (headings in bold caps, codes and counts with even-width digits) */
  --f-display:"Source Sans 3",Helvetica,Arial,sans-serif;
  --f-body:"Source Sans 3",Helvetica,Arial,sans-serif;
  --f-mono:"Source Sans 3",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141312; --surface:#1f1e1c; --ink:#f1efea; --muted:#a29e96; --line:#33312d;
  --red:#ff4d5e; --red-soft:#3a1a1e; --ok:#5cc489; --ok-soft:#183324; --warn:#e3a43a; --warn-soft:#352812; --late:#ff4d5e; --chip:#2a2926; --note:#191816; --red-fill:#d92a3c; --on-ok:#0d2a19; --info:#7aa7f0; --info-soft:#18243a; --mention-on-ink:#1d5a3a; --go:#6fcf97; --go-fill:#2b7a4f; --on-go:#fff; --go-soft:#16291e; --go-line:#2f5c42; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1f1e1c; --ink:#f1efea; --muted:#a29e96; --line:#33312d;
  --red:#ff4d5e; --red-soft:#3a1a1e; --ok:#5cc489; --ok-soft:#183324; --warn:#e3a43a; --warn-soft:#352812; --late:#ff4d5e; --chip:#2a2926; --note:#191816; --red-fill:#d92a3c; --on-ok:#0d2a19; --info:#7aa7f0; --info-soft:#18243a; --mention-on-ink:#1d5a3a; --go:#6fcf97; --go-fill:#2b7a4f; --on-go:#fff; --go-soft:#16291e; --go-line:#2f5c42; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs-md);line-height:1.4;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,[role=button]:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
header button:focus-visible,header input:focus-visible{outline-color:var(--hdr-fg)}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hdr-bg);color:var(--hdr-fg);padding:12px 16px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);max-width:1200px;margin:0 auto;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:var(--sp-3);line-height:1}
.mark .logo{height:48px;width:auto;display:block;margin:-6px 0 -6px -10px}
.mark .sub{font-family:var(--f-display);font-size:var(--fs-md);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--hdr-muted);border-left:1px solid var(--hdr-line);padding-left:12px}
@media (max-width:640px){.mark .logo{height:40px}}
.search{flex:1 1 280px;max-width:460px;position:relative}
.search input{width:100%;font:inherit;font-size:var(--fs-input);padding:12px 40px 12px 14px;border-radius:var(--r-md);border:1px solid var(--hdr-line);background:var(--hdr-field);color:var(--hdr-fg);min-height:46px}
.search input::placeholder{color:var(--hdr-dim)}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--hdr-muted);font-size:var(--fs-xl);width:36px;height:36px}

main{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:14px 120px;display:grid;gap:var(--sp-4)}

.custs{display:flex;gap:var(--sp-2);overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.custs::-webkit-scrollbar{display:none}
.cbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:10px 14px;text-align:left;display:grid;gap:2px;min-height:58px;min-width:140px}
.cbtn .cn{font-weight:600}
.cbtn .cc{font-size:var(--fs-xs);color:var(--muted);font-family:var(--f-mono)}
.cbtn .cc em{color:var(--late);font-style:normal;font-weight:600}
.cbtn .cc em.soon{color:var(--warn)}
.cbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cbtn[aria-pressed="true"] .cc{color:color-mix(in srgb,var(--surface) 70%,transparent)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:var(--sp-3)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;text-align:left;display:grid;gap:2px;min-height:80px}
.tile .n{font-family:var(--f-display);font-weight:700;font-size:var(--fs-2xl);line-height:1}
.tile .l{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:var(--ls-caps);color:var(--muted);font-weight:600}
.tile[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tile.alert .n{color:var(--late)}
.tile.warn .n{color:var(--warn)}
.tile.zero .n{color:var(--muted)}

.toolbar{display:flex;gap:var(--sp-3);align-items:center;justify-content:space-between;flex-wrap:wrap}
.tright{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
.btn.rep{min-height:46px;padding:8px 16px;font-size:var(--fs-md)}
.seg{display:inline-flex;background:var(--chip);border-radius:var(--r-md);padding:3px}
.seg button{border:0;background:transparent;border-radius:var(--r-sm);padding:8px 14px;min-height:40px;font-weight:500;font-size:var(--fs-md)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--sh-raised);font-weight:600}
.scope{font-size:var(--fs-md);color:var(--muted);display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
.scope strong{color:var(--ink)}
.clear{background:var(--chip);border:0;border-radius:var(--r-pill);padding:7px 12px;min-height:36px;font-weight:500;font-size:var(--fs-sm)}

.group h2{font-family:var(--f-display);font-weight:600;font-size:var(--fs-xl);text-transform:uppercase;letter-spacing:var(--ls-display);margin:0 0 10px;display:flex;align-items:baseline;gap:var(--sp-3)}
.orders-break{display:flex;align-items:center;gap:var(--sp-3);margin:8px 0 2px;font-family:var(--f-display);font-weight:600;font-size:var(--fs-xl);text-transform:uppercase;letter-spacing:var(--ls-caps);color:var(--ink)}
.orders-break::after{content:"";flex:1;height:2px;background:var(--ink);opacity:.8}
.orders-break b{font-family:var(--f-mono);font-size:var(--fs-sm);font-weight:500;color:var(--muted);letter-spacing:0}
.group h2 span{font-family:var(--f-mono);font-size:var(--fs-sm);color:var(--muted);letter-spacing:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:var(--sp-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;text-align:left;display:grid;gap:var(--sp-3);min-width:0;align-content:start}
.card{border-left:4px solid var(--line)}
.card.st-go{border-left-color:var(--go)}
.card.st-done{border-left-color:var(--go);background:var(--go-soft)}
.card.st-done .cstage{color:var(--go);font-weight:600}
.card.st-flag{border-left-color:var(--muted)}
.card.st-dead{border-left-color:var(--line)}
.card.soon{border-left:4px solid var(--amber)}
/* past-due projects are listed in the Needs attention block, so the card itself carries only the tag, not a red edge */
.attn{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--late);padding:14px 16px 6px;display:grid;gap:var(--sp-2)}
.attn h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:var(--fs-xl);text-transform:uppercase;letter-spacing:var(--ls-display);display:flex;gap:var(--sp-3);align-items:baseline}
.attn h2 .cnt{font-size:var(--fs-sm);color:var(--muted);letter-spacing:var(--ls-caps)}
.arow{display:flex;align-items:center;gap:var(--sp-3);padding:8px 0;border-top:1px solid var(--line);min-height:56px;cursor:pointer}
.arow .due{flex:none;min-width:104px;text-align:center}
.arow .at{flex:1;min-width:0;display:grid;gap:1px}
.arow .at b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .at span{font-size:var(--fs-sm);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .chev{color:var(--muted);flex:none}
.arow:hover .at b{text-decoration:underline;text-underline-offset:2px}
.attn .more{border:0;background:none;font-weight:600;text-decoration:underline;text-underline-offset:2px;padding:10px 0;min-height:44px;justify-self:start}
.attn .more.others{border-top:1px solid var(--line);width:100%;text-align:left;color:var(--muted)}
.attn.quiet{border-top-color:var(--line)}
.push{flex:none;border:1px solid var(--line);background:var(--surface);font-size:var(--fs-sm);font-weight:600;padding:0 12px;min-height:36px;white-space:nowrap}
.push:hover{border-color:var(--ink)}
.cstat .push{float:right;margin:-4px 0 0 10px}
@media (pointer:coarse){.push{min-height:44px}}
@media (max-width:640px){.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;row-gap:4px;padding:10px 0}.arow .due{grid-column:1;justify-self:start;min-width:0}.arow .at{grid-column:1}.arow .at span{white-space:normal}.arow .push{grid-column:2;grid-row:1/3;align-self:center}.arow .chev{display:none}}
/* the one colored mark on a card besides its edge: a short tag that says how late or how soon */
.due{display:inline-block;font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-caps);padding:2px 8px;white-space:nowrap}
.due.late{background:var(--red-soft);color:var(--late)}
.due.soon{background:var(--warn-soft);color:var(--warn)}
.cstat .due{margin-right:8px;vertical-align:1px}
.cstat .fu{color:var(--muted);font-weight:400}
.ctop{display:flex;justify-content:space-between;gap:var(--sp-3);align-items:flex-start}
.cname{min-width:0;display:grid;gap:2px}
.cdate{font-family:var(--f-mono);font-size:var(--fs-xs);color:var(--muted)}
.ctag{font-size:var(--fs-xs);font-weight:600;text-transform:uppercase;letter-spacing:var(--ls-caps);color:var(--muted)}
.cstat{font-size:var(--fs-md);font-weight:500;overflow-wrap:anywhere}

.cnew{flex:none;font-size:var(--fs-xs);font-weight:600;padding:4px 10px;border-radius:var(--r-pill);background:var(--ink);color:var(--surface);white-space:nowrap}
.cstage{font-size:var(--fs-sm);color:var(--muted)}
.ctitle{font-weight:600;font-size:var(--fs-lg);line-height:1.25}
.cmeta{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-2);flex-wrap:wrap;font-size:var(--fs-sm);color:var(--muted)}
.track{display:flex;gap:var(--sp-1);align-items:center}
.track i{width:18px;height:6px;border-radius:var(--r-pill);background:var(--line)}
.track i.on{background:var(--go)}
.track i.na{background:transparent;border:1px dashed var(--line)}

.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--act);color:var(--on-act);border:0;border-radius:var(--r-pill);padding:14px 22px;font-weight:600;font-size:var(--fs-input);box-shadow:var(--sh-float);min-height:52px;z-index:6}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;max-height:92%;overflow:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto}
.grab{width:44px;height:5px;border-radius:var(--r-pill);background:var(--line);margin:6px auto 10px}
.shead{display:flex;justify-content:space-between;gap:var(--sp-3);align-items:flex-start;margin-bottom:6px}
.shead h3{margin:0;font-size:var(--fs-xl);line-height:1.25}
.x{background:var(--chip);border:0;border-radius:var(--r-pill);width:40px;height:40px;flex:none;font-size:var(--fs-xl)}
.field{display:grid;gap:var(--sp-2);margin-top:18px}
.flabel{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:var(--ls-caps);font-weight:600;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:10px 14px;min-height:44px;font-weight:500}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--sp-2)}
.steps small{font-size:var(--fs-xs);color:var(--muted);font-weight:400}
.stagerow{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);flex-wrap:wrap;font-size:var(--fs-md);color:var(--muted)}
.stagerow .linkbtn{min-height:44px;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.stagerow .linkbtn[aria-pressed="true"]{text-decoration:none;background:var(--chip);border-radius:var(--r-sm);padding:6px 12px}
.flrow{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-2)}
.nextbox{min-height:120px;line-height:1.45;overflow-y:auto}
.nextbox.open{overflow-y:hidden}
.odbtn{display:flex;align-items:center;justify-content:center;gap:var(--sp-2);min-height:48px;margin:4px 0 var(--sp-3);padding:10px 16px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--go-soft);color:var(--go);font-weight:600;font-size:var(--fs-md);text-decoration:none}
.odbtn:hover{border-color:var(--ink)}
.odbtn svg{width:20px;height:20px;flex:none}
.odbtn .ic{width:14px;height:14px}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:10px 12px;min-height:52px;text-align:left;display:flex;gap:var(--sp-3);align-items:center;font-weight:500}
.steps button .box{width:22px;height:22px;border-radius:var(--r-sm);border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:var(--fs-md);color:var(--surface)}
.steps button[data-v="Yes"] .box{background:var(--go-fill);border-color:var(--go-fill);color:var(--on-go)}
.steps button[data-v="Yes"]{border-color:var(--go-line);background:var(--go-soft)}
.steps button[data-v="N/A"]{color:var(--muted)}
.steps button[data-v="N/A"] .box{border-style:dashed}
input[type=text],input[type=date],input[type=url],input[type=search],textarea{width:100%;font:inherit;font-size:var(--fs-input);padding:12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg);color:var(--ink);min-height:48px}
textarea{min-height:70px;resize:vertical}
.quick{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.quick button{background:var(--chip);border:0;border-radius:var(--r-sm);padding:8px 12px;min-height:40px;font-size:var(--fs-md)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.notebox{display:grid;gap:var(--sp-2)}
.addnote{display:flex;gap:var(--sp-2);align-items:flex-end}
.addnote textarea{flex:1;min-height:52px}
.addnote button{flex:none;background:var(--ink);color:var(--surface);border:0;border-radius:var(--r-md);padding:0 18px;min-height:52px;font-weight:600}
.nlog{display:grid;gap:var(--sp-2);max-height:260px;overflow:auto}
.nlog .ne{background:var(--note);border-radius:var(--r-sm);padding:10px 12px;display:grid;gap:var(--sp-1)}
.nlog .nh{display:flex;justify-content:space-between;gap:var(--sp-2);font-family:var(--f-mono);font-size:var(--fs-xs);color:var(--muted)}
.nlog .nh button{border:0;background:transparent;color:var(--muted);font-size:var(--fs-xs);padding:0 4px}
.nlog .nb{font-size:var(--fs-md);overflow-wrap:anywhere;white-space:pre-wrap}
.actions{display:flex;gap:var(--sp-3);margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:var(--r-md);padding:14px 20px;min-height:52px;font-weight:600;font-size:var(--fs-input)}
.btn.primary{background:var(--act);color:var(--on-act);flex:1}
.btn.ghost{background:var(--chip)}
.folder{display:inline-flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-md);font-weight:600;color:var(--ink);text-decoration:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:var(--r-pill);font-size:var(--fs-md);z-index:20;display:flex;align-items:center;max-width:calc(100% - 24px)}
.who{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;font-size:var(--fs-sm);color:var(--muted)}
.who button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:6px 12px;min-height:36px;font-size:var(--fs-sm);font-weight:500}
.who button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.toprow{display:flex;justify-content:space-between;gap:var(--sp-3) var(--sp-4);align-items:center;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:0;background:var(--red);flex:none}
.thread{display:grid;gap:var(--sp-3);max-height:340px;overflow:auto;padding:4px 2px;background:var(--bg);border-radius:var(--r-md);padding:12px}
.msg{display:grid;gap:var(--sp-1);max-width:86%;justify-self:start}
.msg.mine{justify-self:end}
.msg .mh{font-size:var(--fs-xs);color:var(--muted);display:flex;gap:var(--sp-2);align-items:baseline}

.s-x{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:var(--r-sm);font-size:var(--fs-lg)}
.s-x.arm{width:auto;padding:0 10px;background:var(--red-fill);color:var(--on-red);font-size:var(--fs-sm);font-weight:600}
.supadd{display:grid;gap:var(--sp-2)}
.s-sub{font-size:var(--fs-xs);color:var(--muted);display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center}
.s-sub a{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.s-note{font-size:var(--fs-sm);color:var(--ink);background:var(--note);border-radius:var(--r-sm);padding:4px 8px;margin-top:4px;overflow-wrap:anywhere}
.s-name{cursor:pointer}
.linkbtn{border:0;background:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:600;font-size:var(--fs-sm);padding:6px 4px}
.posts{display:grid;gap:var(--sp-3)}
.post{display:flex;gap:var(--sp-3);align-items:flex-start}
.post .pb{flex:1;min-width:0;background:var(--note);border-radius:var(--r-sm) var(--r-md) var(--r-md) var(--r-md);padding:9px 12px;display:grid;gap:var(--sp-1)}
.post .pm{font-size:var(--fs-xs);color:var(--muted)}
.post .pm b{color:var(--ink)}
.post .pt{font-size:var(--fs-md);white-space:pre-wrap;overflow-wrap:anywhere}
.del2{border:0;background:var(--chip);color:var(--muted);border-radius:var(--r-md);padding:14px 16px;min-height:52px;font-weight:600}
.del2.arm{background:var(--red-fill);color:var(--on-red)}
.login{position:fixed;inset:0;z-index:60;background:var(--hdr-bg);display:grid;place-items:center;padding:24px 16px;overflow:auto}
.lbox{width:min(420px,100%);background:var(--surface);border-radius:var(--r-lg);padding:24px;display:grid;gap:var(--sp-4);box-shadow:var(--sh-float)}
.lbox .llogo{background:var(--hdr-bg);border-radius:var(--r-md);padding:6px 10px;justify-self:start}
.lbox .llogo img{height:44px;display:block}
.lbox h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:var(--fs-2xl);text-transform:uppercase;letter-spacing:var(--ls-display)}
.lbox p{margin:0;color:var(--muted);font-size:var(--fs-md)}
.lbox p.err{color:var(--red);font-weight:500}
.lbox label{display:grid;gap:var(--sp-2);font-size:var(--fs-xs);font-weight:600;text-transform:uppercase;letter-spacing:var(--ls-caps);color:var(--muted)}
.lbox input{width:100%;font:inherit;font-size:var(--fs-input);padding:12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg);color:var(--ink);min-height:48px}
.lbox .btn.primary{width:100%}
.lbox .btn.ms{width:100%;display:flex;align-items:center;justify-content:center;gap:var(--sp-3);background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:var(--r-md);min-height:52px;font-weight:600;font-size:var(--fs-input)}
.lor{display:flex;align-items:center;gap:var(--sp-3);color:var(--muted);font-size:var(--fs-sm)}
.lor::before,.lor::after{content:"";flex:1;height:1px;background:var(--line)}
.who button{margin-left:6px}
.syncdot{display:inline-block;width:8px;height:8px;border-radius:0;background:var(--go);margin-left:8px;vertical-align:1px}
.syncdot.busy{background:var(--warn)}.syncdot.off{background:var(--red)}
.hist summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:var(--sp-2);min-height:36px}
.hist summary::-webkit-details-marker{display:none}
.hlist{display:grid;gap:var(--sp-2);max-height:240px;overflow:auto}
.hi{display:flex;justify-content:space-between;gap:var(--sp-3);font-size:var(--fs-sm);padding:7px 10px;background:var(--note);border-radius:var(--r-sm)}
.hi .hw{flex:none;font-family:var(--f-mono);font-size:var(--fs-xs);color:var(--muted);padding-top:2px}
.empty-state{color:var(--muted);padding:24px;border:1px dashed var(--line);border-radius:var(--r-md);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
/* Touch targets: at least 44px on iPad (small visuals get a larger invisible hit area) */
.fchips button,.tagrow button,.who button,.clear,.pending button,.seg button,.quick button,.appnav button,.ai-sugg button,.nalert .ghost,.npanel .nhead .linkbtn,.hist summary,.sup .stp{min-height:44px}
.x,.npanel .x{width:44px;height:44px}
.search .clr{width:44px;height:44px;right:2px}
.s-x{min-width:44px;height:44px}
.fchips button{min-width:44px}
.ph .linkbtn{min-height:44px}
.folder{position:relative}
.folder::before{content:"";position:absolute;inset:-12px -4px}
.chk,.s-sub a,.s-sub .linkbtn,.ai-act button{position:relative}
.chk::before{content:"";position:absolute;inset:-9px}
.s-sub a::before,.s-sub .linkbtn::before,.ai-act button::before{content:"";position:absolute;inset:-14px -6px}
@media (prefers-reduced-motion:no-preference){.card,.req{transition:transform .12s ease-out}.card:active{transform:scale(.99)}.req:active{transform:scale(.995)}}
/* Icons */
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em;pointer-events:none}
.x .ic,.s-x .ic,.search .clr .ic{width:20px;height:20px}
.chk .ic,.steps .box .ic{width:16px;height:16px;vertical-align:0}
.sup .chk .ic{width:14px;height:14px}
.icn{display:inline-flex;align-items:center;gap:var(--sp-1)}
.fab,.addc{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2)}
.fab .ic{width:20px;height:20px}
.x,.s-x,.search .clr{display:grid;place-items:center}
.glrow .chev{width:20px;height:20px;color:var(--muted)}
.hchev{width:16px;height:16px;transition:transform .15s}
.hist[open] .hchev{transform:rotate(90deg)}
.folder .ic,.s-sub a .ic{width:14px;height:14px;vertical-align:-.1em;margin-left:2px}
/* Interaction: pressed states, hover on pointer devices, panels fade in (skipped when Reduce Motion is on) */
@media (hover:hover){.card:hover,.req:hover,.glrow:hover,.cbtn:hover,.tile:hover{border-color:var(--muted)}.glrow:hover{background:var(--chip)}}
@media (prefers-reduced-motion:no-preference){
  .btn,.fab,.send,.chips button,.quick button,.seg button,.fchips button,.tile,.cbtn,.chk,.x,.glrow{transition:transform .1s ease-out,background-color .15s,border-color .15s}
  .btn:active,.fab:active,.send:active,.chips button:active,.quick button:active,.seg button:active,.fchips button:active,.tile:active,.cbtn:active,.x:active{transform:scale(.97)}
  .scrim{animation:fadein .18s ease-out}
  .npanel{animation:pop .18s ease-out}
  .ai{animation:slidein .22s ease-out}
  .toast{animation:toastin .18s ease-out}
  @keyframes fadein{from{opacity:0}}
  @keyframes pop{from{opacity:0;transform:translateY(-6px)}}
  @keyframes slidein{from{transform:translateX(24px);opacity:.6}}
  @keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}}
}
.aisugg{margin-top:var(--sp-2);border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:var(--sp-3);display:flex;gap:var(--sp-3);align-items:center;justify-content:space-between;flex-wrap:wrap}
.aisugg-wait{font-size:var(--fs-sm);color:var(--muted)}
.aisugg-txt{display:grid;gap:2px;min-width:0;flex:1 1 220px;font-size:var(--fs-md);overflow-wrap:anywhere;white-space:pre-line;max-height:240px;overflow-y:auto}
.aisugg .eyebrow{font-size:var(--fs-xs);font-weight:600;text-transform:uppercase;letter-spacing:var(--ls-caps);color:var(--muted)}
.aisugg-btns{display:flex;gap:var(--sp-2)}
.aisugg-btns button{min-height:44px;padding:0 var(--sp-4);border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);font-weight:600}
.aisugg-btns button.ok{background:var(--ink);color:var(--surface);border-color:var(--ink)}
</style>

<script>
const TODAY=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const STATUSES = ["New Request","Quoting","Quote Sent","Samples","Ready to Order","Needs Info","Order Placed","In Production","Ready to Ship","Shipped","Delivered","On Hold","Completed","Dead"];
const STEPS = ["Factory Quote","Quote Sent","Sample Approved","Order Placed","Shipped","Delivered"];
const ACTIVE = ["New Request","Quoting","Quote Sent","Samples","Ready to Order","Needs Info"];
const OPEN_ORDER = ["Order Placed","In Production","Ready to Ship","Shipped"];
const CLOSED = ["Delivered","Completed","Dead"];
const TABS=[["progress","In progress",s=>!CLOSED.includes(s)&&!OPEN_ORDER.includes(s)],["ordered","Ordered",s=>OPEN_ORDER.includes(s)],["completed","Completed",s=>s==="Delivered"||s==="Completed"],["dead","Dead",s=>s==="Dead"]];
const tabOf=s=>TABS.find(t=>t[2](s))[0];
/* Milestones set the stage. The saved status is kept as-is in the database; older values map onto a stage here
   (and count as a floor, so nothing looks like it went backwards). Flags cover what milestones can't say. */
const STEP_LABEL = {"Factory Quote":"Factory quote","Quote Sent":"Quote sent","Sample Approved":"Sample approved","Order Placed":"Order placed","Shipped":"Shipped","Delivered":"Delivered"};
const STAGE_NAME = ["New request","Factory quote in","Quote sent","Sample approved","Order placed","Shipped","Delivered"]; // index = stage + 1
const STAGE_STATUS = ["New Request","Quoting","Quote Sent","Ready to Order","Order Placed","Shipped","Delivered"];      // status written for each stage
const STATUS_RANK = {"New Request":-1,"Quoting":-1,"Quote Sent":1,"Samples":1,"Ready to Order":2,"Order Placed":3,"In Production":3,"Ready to Ship":3,"Shipped":4,"Delivered":5,"Completed":5};
const FLAGS = ["Needs Info","On Hold","Dead"];
const FLAG_LABEL = {"Needs Info":"Needs info","On Hold":"On hold","Dead":"Dead"};
const stepStage = steps => { let s=-1; STEPS.forEach((k,i)=>{ if((steps||{})[k]==="Yes") s=i; }); return s; };
const stageOf = p => Math.max(stepStage(p.steps), STATUS_RANK[p.status] ?? -1);
const flagOf = p => FLAGS.includes(p.status)?p.status:"";
const es = p => flagOf(p) || STAGE_STATUS[stageOf(p)+1];          // effective status, used for lists, tabs and counts
const stageLabel = p => flagOf(p) ? FLAG_LABEL[flagOf(p)] : STAGE_NAME[stageOf(p)+1];
// Milestones as they should look for the stage (older projects get earlier steps filled in, skipped steps stay skipped)
const filledSteps = p => { const s=stageOf(p), out={}; STEPS.forEach((k,i)=>{ const v=(p.steps||{})[k]; out[k]=v==="N/A"?"N/A":i<=s?"Yes":"No"; }); return out; };
const STAGE_GROUPS = [["New request",["New Request"]],["Factory quote in",["Quoting"]],["Quote sent",["Quote Sent"]],["Sample approved",["Ready to Order"]],["Needs info",["Needs Info"]],["On hold",["On Hold"]],["Order placed",["Order Placed"]],["Shipped",["Shipped"]],["Delivered",["Delivered"]],["Dead",["Dead"]]];
const LANES = ["NEI D Lapp","NEI D Glick","Factory","Customer","Freight","Nobody"];
const LANE_LABEL = {"NEI D Lapp":"Waiting on Lapp D","NEI D Glick":"Waiting on Daniel G","Factory":"Waiting on factory","Customer":"Waiting on customer","Freight":"Waiting on freight","Nobody":"Not waiting on anyone"};
const pillClass = s => ["Order Placed","In Production","Ready to Ship","Shipped","Delivered","Completed"].includes(s)?"s-order":["Quote Sent","Samples","Ready to Order","Quoting"].includes(s)?"s-mid":["On Hold","Dead"].includes(s)?"s-hold":s==="Needs Info"?"s-info":"";

const uid=()=>(window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const TEAM=["D Lapp","D Glick","Kristen","Patty"];
const TEAM_LABEL={"D Lapp":"Lapp D","D Glick":"Daniel G","Kristen":"Kristin","Patty":"Patty"};
function P(customer,name,vendor,status,waiting,next,fu,steps,note){
  const m={Y:"Yes",N:"No",A:"N/A","-":""};
  const st=Object.fromEntries(STEPS.map((s,i)=>[s,m[steps[i]]]));
  return {id:uid(),customer,name,vendor,status,waiting,next,fu,folder:"",steps:st,
    notes: note?[{id:uid(),at:"",by:"",text:note,mentions:[],seen:[]}]:[]};
}

const KEY="nei-hub-prefs-v1";
let prefs={}; try{ prefs=JSON.parse(localStorage.getItem(KEY))||{} }catch(e){}
let state={projects:[],customers:[],custInfo:{},office:{tasks:[],supplies:[],posts:[]},me:null,tab:prefs.tab||"progress",view:prefs.view||"office",groupBy:prefs.groupBy||"waiting"};
const OCATS=["Travel","Office supplies","Office","IT","Other"];
const catCls=c=>({"Travel":"travel","Office supplies":"supplies","IT":"it"}[c]||"");
let officeCat="All";
let custFilter=null, tileFilter=null, query="";
const save=()=>{ try{localStorage.setItem(KEY,JSON.stringify({tab:state.tab,view:state.view,groupBy:state.groupBy}))}catch(e){} queueSync(); };

const $=s=>document.querySelector(s);
// One icon set: line icons at the same 1.8 stroke as the camera and folder
const IC={check:"M20 6 9 17l-5-5",x:"M18 6 6 18M6 6l12 12",chat:"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z",external:"M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6",chevron:"m9 18 6-6-6-6",plus:"M12 5v14M5 12h14"};
const odBtn=u=>safeUrl(u)?`<a class="odbtn" href="${esc(safeUrl(u))}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Open OneDrive folder</span>${ic("external")}</a>`:"";
const ic=(n,cls)=>`<svg class="ic${cls?" "+cls:""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${IC[n]}"/></svg>`;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isOpen=p=>!CLOSED.includes(es(p));
const isLate=p=>p.fu && isOpen(p) && new Date(p.fu+"T00:00")<=TODAY;
// For color and wording only: a date that has passed is "late" (red); today through 3 days out is "soon" (amber).
const dayGap=d=>Math.round((new Date(d+"T00:00")-TODAY)/864e5);
const dueTier=d=>{ if(!d) return ""; const n=dayGap(d); return n<0?"late":n<=3?"soon":""; };
const dueTag=d=>{ const n=dayGap(d), t=dueTier(d); if(!t) return ""; const w=n<0?(n===-1?"1 day late":(-n)+" days late"):n===0?"Due today":n===1?"Due tomorrow":"Due "+fmt(d); return `<span class="due ${t}">${w}</span>`; };
// a group of projects reads red if any is past due, amber if the nearest is only due today
const groupTone=ps=>ps.some(p=>isLate(p)&&dueTier(p.fu)==="late")?"alert":ps.some(isLate)?"warn":"";
const fmt=d=>{ if(!d) return ""; const x=new Date(d+"T00:00"); return (x.getMonth()+1)+"/"+x.getDate() };
const split=n=>{ const m=n.match(/^(\d{4}-\d{2}-\d{2})\s+(.*)$/); return m?[m[1],m[2]]:["",n] };
const unseenFor=(p,who)=>p.notes.filter(m=>m.mentions.includes(who)&&!m.seen.includes(who)&&m.by!==who).length;
const whenTxt=at=>{ if(!at) return "From tracker"; const d=new Date(at); const sameDay=d.toDateString()===new Date().toDateString(); const t=d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}); return sameDay?t:(d.getMonth()+1)+"/"+d.getDate()+" "+t; };

// Tags work however the name is typed: @Kristin, @kristen, @Daniel G, @Glick, @Lapp D, @Lapp, @Patty

function statusLine(p,noWaiting,noFu){
  const parts=[], f=flagOf(p), open=isOpen(p);
  if(f) parts.push(FLAG_LABEL[f]);
  if(open){
    const w=p.waiting&&LANE_OF[state.me]===p.waiting?"Waiting on you":p.waiting==="Customer"?"Waiting on "+p.customer:(LANE_LABEL[p.waiting]||"");

    if(p.fu&&!noFu){ const x=new Date(p.fu+"T00:00"); parts.push(+x===+TODAY?"follow up today":x<TODAY?"follow-up was due "+fmt(p.fu):"follow up "+fmt(p.fu)); }

}

  const isDirty=()=>{ if(!$("#fNote")) return false; readInputs();
    if($("#fNote").value.trim()||pendImg) return true;
    if(isNew&&(($("#fName").value.trim())||$("#fNewCust").value.trim()||draft.notes.length||draft.customer!==orig.customer)) return true;
    return draft.flag!==orig.flag||FIELDS.some(k=>(draft[k]||"")!==(orig[k]||""))||STEPS.some(s=>(draft.steps[s]||"")!==(orig.steps[s]||"")); };
  const stepsChanged=()=>STEPS.some(s=>(draft.steps[s]||"")!==(orig.steps[s]||""));
  $("#close").onclick=$("#cancel").onclick=$("#scrim").onclick=guardClose(isDirty,close);
  $("#saveBtn").onclick=()=>{
    if(!isNew&&!live()){ sheetClose=null; close(); toast("Someone else deleted this project. Nothing was saved.",{ms:4000}); return; }
    if($("#fNote").value.trim()){ skipSuggest=true; sendMsg(); }
    readInputs();
    // the status follows the flag, or the milestones; it's only rewritten when one of those changed
    const st=draft.flag||STAGE_STATUS[stepStage(draft.steps)+1];
    if(isNew||stepsChanged()||draft.flag!==orig.flag) draft.status=st;
    const save_=x=>{ delete x.flag; return x; };
    if(isNew){
      const nc=$("#fNewCust").value.trim(); if(nc){ draft.customer=nc; if(!state.customers.includes(nc)) state.customers.push(nc); }
      if(!draft.customer){ toast("Pick a customer first"); return; }
      const nm=$("#fName").value.trim(); if(!nm){ $("#fName").focus(); toast("Add a product name first"); return; }
      draft.name=$("#fDate").value+" "+nm; state.projects.push(save_(draft));
    } else {
      // Only write the fields this person changed, onto the latest copy, so a teammate's edits made meanwhile survive
      const cur=live(); const was=tabOf(es(cur));
      FIELDS.forEach(k=>{ if((draft[k]||"")!==(orig[k]||"")) cur[k]=draft[k]; });
      if(stepsChanged()) cur.steps={...draft.steps};
      var moved=tabOf(es(cur))!==was?TABS.find(t=>t[0]===tabOf(es(cur)))[1]:null; }
    sheetClose=null; save(); close(); render(); toast(isNew?"Project added":moved?"Saved. Moved to "+moved:"Saved");
  };
}

function confirmAI(desc,signal){
  return new Promise(res=>{ const log=$("#aiLog"); if(!log||signal?.aborted){ res(false); return; }
    const id=uid(); log.insertAdjacentHTML("beforeend",`<div class="ai-confirm" id="cf-${id}"><div>${esc(desc)}</div><div class="row"><button type="button" class="ok">Confirm</button><button type="button" class="no">Cancel</button></div></div>`);
    const el=document.getElementById("cf-"+id); log.scrollTop=1e9; let settled=false;
    const done=v=>{ if(settled) return; settled=true; el.classList.add("done"); el.querySelector(".row").innerHTML=`<span>${v?"Confirmed":"Cancelled, nothing saved"}</span>`; res(v); };
    el.querySelector(".ok").onclick=()=>done(true); el.querySelector(".no").onclick=()=>done(false);
    signal?.addEventListener("abort",()=>done(false),{once:true}); });
}

/* ---------- AI assistant through the company key ---------- */
async function claudeFn(turns,opts={}){
  const system=turns[0].content; const msgs=[];
  for(const t of turns.slice(1)){ const last=msgs[msgs.length-1]; if(last&&last.role===t.role&&typeof last.content==="string") last.content+="\n\n"+t.content; else msgs.push({role:t.role,content:t.content}); }
  if(!msgs.length||msgs[0].role!=="user") throw {code:"invalid_request"};
  const tools=(opts.tools||[]).map(t=>({name:t.name,description:t.description,input_schema:t.inputSchema||{type:"object",properties:{}}}));
  let text="";
  for(let round=0;round<8;round++){
    if(opts.signal&&opts.signal.aborted) throw {code:"cancelled",text};
    const {data,error}=await sb.functions.invoke("ai",{body:{system,messages:msgs,tools}});
    if(opts.signal&&opts.signal.aborted) throw {code:"cancelled",text};
    if(error){ let code="upstream_error"; try{ const st=error.context&&error.context.status; const j=await error.context.json(); if(j.error==="not_configured") code="not_configured"; else if(j.error==="not_on_team") code="not_granted"; else if(st===429) code="rate_limited"; }catch(e){} throw {code,text}; }
    const blocks=(data&&data.content)||[];
    const t=blocks.filter(b=>b.type==="text").map(b=>b.text).join("");
    if(t){ text=text?text+"\n\n"+t:t; if(opts.onText) opts.onText({text,delta:t}); }
    const uses=blocks.filter(b=>b.type==="tool_use");
    if(data.stop_reason!=="tool_use"||!uses.length) return {text:text||"Done."};
    msgs.push({role:"assistant",content:blocks});
    const results=[];
    for(const u of uses){ const tool=(opts.tools||[]).find(x=>x.name===u.name); let out, isErr=false;
      try{ if(!tool) throw new Error("Unknown tool"); out=await tool.execute(u.input||{},{signal:opts.signal}); }catch(e){ out="Error: "+(e&&e.message||e); isErr=true; }
      results.push({type:"tool_result",tool_use_id:u.id,content:typeof out==="string"?out:JSON.stringify(out),is_error:isErr}); }
    msgs.push({role:"user",content:results});
  }
  return {text:text||"Done."};
}

  const tool={name:"suggest_update",description:"Suggest changes to this project's next step, waiting on and follow-up date.",input_schema:{type:"object",properties:{next:{type:"string"},waitingOn:{type:"string",enum:LANES},followUp:{type:"string",description:"YYYY-MM-DD"}}}};
  const {data,error}=await sb.functions.invoke("ai",{body:{system,messages:[{role:"user",content:user}],tools:[tool]}});
  if(error) return null;
  const u=((data&&data.content)||[]).find(b=>b.type==="tool_use"&&b.name==="suggest_update"); if(!u) return null;
  const i=u.input||{}, out={};
  const nx=String(i.next||"").trim().slice(0,2000); if(nx&&nx!==(p.next||"")) out.next=nx;

  ws.columns=COLS.map(([,w])=>({width:w}));
  const groups=reportGroups(ps);

  // Header band (rows 1-3): logo left, title + subtitle right, all on black
  [34,30,24].forEach((h,i)=>{ const r=ws.getRow(i+1); r.height=h; for(let c=1;c<=N;c++) r.getCell(c).fill=fill(BLACK); });
  const tFrom=colL(4);
  ws.mergeCells(`${tFrom}1:${colL(N)}2`); ws.mergeCells(`${tFrom}3:${colL(N)}3`);
  const title=ws.getCell(`${tFrom}1`);
  title.value=reportTitle(groups,oneCustomer);
  title.font=F({size:24,bold:true,color:{argb:WHITE}}); title.alignment={horizontal:"right",vertical:"bottom",indent:1};
  const sub=ws.getCell(`${tFrom}3`);
  sub.value=reportSub();
  sub.font=F({size:12,color:{argb:WHITE}}); sub.alignment={horizontal:"right",vertical:"top",indent:1};
  const logo=await loadReportLogo();
  if(logo){ const id=wb.addImage({base64:logo,extension:"png"}); ws.addImage(id,{tl:{col:0.25,row:0.45},ext:{width:250,height:63},editAs:"absolute"}); }

  // Thin red rule, then the filter line
  const rule=ws.getRow(4); rule.height=4; for(let c=1;c<=N;c++) rule.getCell(c).fill=fill(RED);
  ws.getRow(5).height=8;
  const info=ws.getCell("A6"); info.value=filterText; info.font=F({size:11,color:{argb:GREY}}); ws.getRow(6).height=20;
  ws.getRow(7).height=8;

  // Column headers (one row, frozen, filterable)
  const HR=8, hr=ws.getRow(HR); hr.height=30;
  COLS.forEach(([h],i)=>{ const c=hr.getCell(i+1); c.value=h; c.fill=fill(BLACK); c.font=F({size:12,bold:true,color:{argb:WHITE}});
    c.alignment={horizontal:i===0?"center":"left",vertical:"middle",indent:i===0?0:1}; });
  ws.views=[{state:"frozen",ySplit:HR,showGridLines:false}];

  const showBands=groups.length>1;
  let r=HR+1;
  groups.forEach(g=>{
    if(showBands){ const br=ws.getRow(r); br.height=30;
      const c=br.getCell(1); c.value=`${g.customer.toUpperCase()}   (${g.rows.length} open)`; c.font=F({size:14,bold:true}); c.alignment={vertical:"bottom"};
      for(let k=1;k<=N;k++) br.getCell(k).border={bottom:{style:"medium",color:{argb:RED}}};
      r++; }
    g.rows.forEach(({vals,late},i)=>{
      const row=ws.getRow(r);
      vals.forEach((v,k)=>{ const c=row.getCell(k+1); c.value=v;
        c.font=F(k===0||k===1?{bold:true}:k===5&&late?{bold:true,color:{argb:REDTXT}}:{});
        c.alignment={vertical:"middle",wrapText:k!==0,horizontal:k===0?"center":"left",indent:k===0?0:1};
        c.border={bottom:{style:"thin",color:{argb:LINE}}};
        if(i%2===1) c.fill=fill(ZEBRA); });
      const longest=Math.max(...[1,4,6,8].map(k=>Math.ceil(String(vals[k]).length/(COLS[k][1]*0.85))));
      row.height=Math.max(34,Math.min(longest,8)*17+10);
      r++; });
    if(showBands){ ws.getRow(r).height=12; r++; }
  });
  const tot=ws.getCell(`A${r+1}`); tot.value=reportTotal(ps,groups);
  tot.font=F({size:12,bold:true});

  ws.autoFilter={from:{row:HR,column:1},to:{row:HR,column:N}};
  ws.pageSetup={orientation:"landscape",paperSize:1,fitToPage:true,fitToWidth:1,fitToHeight:0,printTitlesRow:`${HR}:${HR}`,horizontalCentered:true,
    margins:{left:0.4,right:0.4,top:0.5,bottom:0.6,header:0.3,footer:0.3}};
  ws.headerFooter={oddFooter:`&L&"Arial"&8&K666666${REPORT_CONTACT}&R&"Arial"&8&K666666Page &P of &N`};
  return wb;
}

// ---- PDF version of the same report (letter, landscape), followed by the blank New Project Request pages ----
let pdfLoading=null;
function loadPDF(){
  if(window.jspdf) return Promise.resolve();
  return pdfLoading||(pdfLoading=new Promise((res,rej)=>{ const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js";
    s.onload=()=>res(); s.onerror=()=>{ pdfLoading=null; rej(new Error("Could not load the PDF tool")); }; document.head.appendChild(s); }));
}
// The PDF's built-in font only knows plain Western characters, so curly quotes, long dashes and the like are swapped for plain ones.
const pdfTxt=t=>String(t??"").replace(/[‘’′]/g,"'").replace(/[“”″]/g,'"').replace(/[–—−]/g,"-").replace(/…/g,"...").replace(/[•●]/g,"·").replace(/→/g,"->").replace(/[   ]/g," ").replace(/[✓✔]/g,"x").replace(/\s*[\r\n]+\s*/g," ").replace(/[^\x20-\x7E¡-ÿ]/g,"");
const REQUEST_FORM_PAGES=2; // two forms per page
async function buildReportPDF(ps,filterText,oneCustomer){
  const BLK=[10,10,10], TXT=[38,38,38], GRY=[102,102,102], ZEB=[242,242,242], BOR=[217,217,217], RED=[226,59,40], REDTXT=[196,42,24], WHT=[255,255,255];
  const doc=new window.jspdf.jsPDF({orientation:"landscape",unit:"pt",format:"letter"});
  doc.setProperties({title:"Open projects report",author:"Northeast International"});
  const PW=doc.internal.pageSize.getWidth(), PH=doc.internal.pageSize.getHeight(), M=36, W=PW-2*M, BAND=62, BOTTOM=46;
  const font=(size,bold,col)=>{ doc.setFont("helvetica",bold?"bold":"normal"); doc.setFontSize(size); doc.setTextColor(...(col||TXT)); };
  const rect=(x,y,w,h,col)=>{ doc.setFillColor(...col); doc.rect(x,y,w,h,"F"); };
  const hline=(x1,x2,y,col,lw)=>{ doc.setDrawColor(...col); doc.setLineWidth(lw||0.5); doc.line(x1,y,x2,y); };
  const logo=await loadReportLogo();
  const band=(title,sub)=>{ rect(0,0,PW,BAND,BLK);
    if(logo){ try{ doc.addImage(logo,"PNG",M,9,175,44.1,"neilogo","FAST"); }catch(e){} }
    font(18,true,WHT); doc.text(pdfTxt(title),PW-M,30,{align:"right"});
    font(9.5,false,WHT); doc.text(pdfTxt(sub),PW-M,46,{align:"right"});
    rect(0,BAND,PW,3,RED); };

  // ---- open projects table
  const groups=reportGroups(ps), title=reportTitle(groups,oneCustomer), sub=reportSub();
  const xs=[]; REPORT_COLS.reduce((x,c,i)=>{ xs[i]=x; return x+c[2]; },M);
  const FS=9, LH=11, PADY=7, HEADH=20;
  let y=0;
  const colHead=()=>{ rect(M,y,W,HEADH,BLK); font(9.5,true,WHT);
    REPORT_COLS.forEach(([h,,w],i)=>doc.text(h,i===0?xs[i]+w/2:xs[i]+5,y+13.5,i===0?{align:"center"}:{})); y+=HEADH; };
  const startPage=first=>{ if(!first) doc.addPage(); band(title,sub); y=BAND+3+18; font(9,false,GRY); doc.text(pdfTxt(filterText),M,y); y+=10; colHead(); };
  startPage(true);
  const showBands=groups.length>1;
  groups.forEach(g=>{
    const cells=g.rows.map(({vals,late})=>{ const lines=vals.map((v,k)=>{ font(FS,k<2||(k===5&&late)); return k===0?[String(v)]:doc.splitTextToSize(pdfTxt(v),REPORT_COLS[k][2]-10); });
      return {lines,late,h:Math.max(24,Math.max(...lines.map(l=>l.length))*LH+2*PADY-2)}; });
    if(showBands){ if(y+30+(cells[0]?cells[0].h:0)>PH-BOTTOM) startPage(false);
      font(12,true); doc.text(pdfTxt(`${g.customer.toUpperCase()}   (${g.rows.length} open)`),M,y+21); hline(M,PW-M,y+27,RED,1.2); y+=27; }
    cells.forEach(({lines,late,h},i)=>{
      if(y+h>PH-BOTTOM) startPage(false);
      if(i%2===1) rect(M,y,W,h,ZEB);
      lines.forEach((ls,k)=>{ font(FS,k<2||(k===5&&late),k===5&&late?REDTXT:TXT); const w=REPORT_COLS[k][2];
        const top=y+(h-ls.length*LH)/2+LH-2.8;
        ls.forEach((t,j)=>doc.text(t,k===0?xs[k]+w/2:xs[k]+5,top+j*LH,k===0?{align:"center"}:{})); });
      hline(M,PW-M,y+h,BOR,0.5); y+=h; });
    if(showBands) y+=8;
  });
  if(y+26>PH-BOTTOM) startPage(false);
  font(10.5,true); doc.text(reportTotal(ps,groups),M,y+20);

  // ---- New Project Request pages (always added to the PDF version)
  const box=(x,yy)=>{ doc.setDrawColor(...TXT); doc.setLineWidth(0.8); doc.rect(x,yy,11,11,"S"); };
  const form=(y0,h,idx)=>{
    doc.setDrawColor(...TXT); doc.setLineWidth(1); doc.rect(M,y0,W,h,"S");
    font(13,true,RED); doc.text(`NEW PROJECT REQUEST  #N${idx}`,M+10,y0+20);
    font(9.5,false,TXT); doc.text("Date: ________________",M+W-10,y0+20,{align:"right"});
    const lineRow=(yy,items)=>{ let x=M+10; const avail=W-20; items.forEach(([lab,frac])=>{ const ww=avail*frac; font(8.5,false,GRY); doc.text(lab,x,yy-16); hline(x,x+ww-12,yy,BOR,0.5); x+=ww; }); };
    let yy=y0+58;
    lineRow(yy,[["Product / what is it",0.62],["Qty per order / per year",0.38]]); yy+=36;
    lineRow(yy,[["Size / specs / material",0.62],["Target price (each)",0.38]]); yy+=36;
    lineRow(yy,[["Who sells it now / brand to match",0.62],["Needed by (date)",0.38]]); yy+=30;
    let x=M+10; font(9.5,false,TXT);
    ["Sample available","Photo of item attached","Catalog page attached","Urgent"].forEach(lab=>{ box(x,yy-9); doc.text(lab,x+16,yy); x+=170; });
    yy+=20; font(8.5,false,GRY); doc.text("Notes",M+10,yy);
    for(let k=0;k<3;k++){ yy+=18; if(yy<y0+h-6) hline(M+10,M+W-10,yy,BOR,0.5); }
  };
  const fh=(PH-BAND-3-50-14-12)/2;
  for(let pg=0;pg<REQUEST_FORM_PAGES;pg++){ doc.addPage();
    band("NEW PROJECT REQUESTS","Fill one box per product · Snap a photo and text or email it to Daniel");
    form(BAND+3+12,fh,pg*2+1); form(BAND+3+12+fh+14,fh,pg*2+2); }

  // ---- footer on every page
  const pages=doc.getNumberOfPages();
  for(let n=1;n<=pages;n++){ doc.setPage(n); hline(M,PW-M,PH-34,RED,1); font(7.5,false,GRY); doc.text(REPORT_CONTACT,M,PH-22); doc.text(`Page ${n} of ${pages}`,PW-M,PH-22,{align:"right"}); }
  return doc;
}
function openReportSheet(){
  const open=state.projects.filter(isOpen);
  const custs=reportCustomers(open), stages=[...STAGE_STATUS,...FLAGS].filter(s=>!CLOSED.includes(s)&&open.some(p=>es(p)===s)), lanes=LANES;
  const sel={c:new Set(),s:new Set(),w:new Set()};
  let fmtSel="xlsx"; try{ if(localStorage.getItem("neiReportFmt")==="pdf") fmtSel="pdf"; }catch(e){}
  const stLabel=x=>FLAG_LABEL[x]||STAGE_NAME[STAGE_STATUS.indexOf(x)]||x;
  const grp=(k,label,opts,labels)=>`<div class="field"><span class="flabel">${label}</span><div class="chips" data-rf="${k}"><button type="button" data-all="1" aria-pressed="true">All</button>${opts.map((o,i)=>`<button type="button" aria-pressed="false" data-v="${esc(o)}">${esc(labels?labels[i]:o)}</button>`).join("")}</div></div>`;
  $("#sheetHost").innerHTML=`<div class="scrim" id="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Download report">
    <div class="grab"></div><div class="shead"><h3>Open projects report</h3><button class="x" id="close" aria-label="Close">${ic("x")}</button></div>
    <p style="margin:6px 0 0;color:var(--muted);font-size:var(--fs-md)">Open projects, grouped by customer. Leave a row on All to include everything.</p>
    ${grp("c","Customer",custs)}${grp("s","Stage",stages,stages.map(stLabel))}${grp("w","Who has it",lanes,lanes.map(laneShort))}
    <div class="field"><span class="flabel">Format</span><div class="chips" id="repFmt" role="group" aria-label="Format"><button type="button" data-fmt="xlsx">Excel</button><button type="button" data-fmt="pdf">PDF</button></div>
      <p id="repFmtNote" style="margin:8px 0 0;color:var(--muted);font-size:var(--fs-md)"></p></div>
    <p id="repCount" style="margin:18px 0 0;font-weight:600"></p>
    <div class="actions"><button class="btn primary" id="repGo">Download report</button></div></div>`;
  const pick=()=>open.filter(p=>(!sel.c.size||sel.c.has(p.customer))&&(!sel.s.size||sel.s.has(es(p)))&&(!sel.w.size||sel.w.has(p.waiting||"Nobody")));
  const upd=()=>{ const n=pick().length; $("#repCount").textContent=`${n} open project${n===1?"":"s"} match`; $("#repGo").disabled=!n; };
  const drawFmt=()=>{ document.querySelectorAll("#repFmt button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.fmt===fmtSel)));
    $("#repFmtNote").textContent=fmtSel==="pdf"?"Ready to print or email. The blank New Project Request pages are added at the end.":"Editable spreadsheet you can sort and filter."; };
  $("#repFmt").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; fmtSel=b.dataset.fmt; try{ localStorage.setItem("neiReportFmt",fmtSel); }catch(err){} drawFmt(); };
  document.querySelectorAll("[data-rf]").forEach(g=>g.onclick=e=>{ const b=e.target.closest("button"); if(!b) return; const set=sel[g.dataset.rf];
    if(b.dataset.all) set.clear(); else { const v=b.dataset.v; set.has(v)?set.delete(v):set.add(v); }
    g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.all?String(!set.size):String(set.has(x.dataset.v))));
    upd(); });
  const close=()=>$("#sheetHost").innerHTML="";
  $("#close").onclick=$("#scrim").onclick=close;
  const desc=()=>{ const f=(k,l,m)=>`${l}: ${sel[k].size?[...sel[k]].map(m||(x=>x)).join(", "):"All"}`; return [f("c","Customer"),f("s","Stage",stLabel),f("w","Who has it",laneShort)].join(" · "); };
  const go=async(full)=>{ const ps=full?open:pick(); if(!ps.length){ toast("No open projects match"); return; }
    const pdf=fmtSel==="pdf";
    try{ toast("Building report…"); await (pdf?loadPDF():loadXLSX());
      const one=!full&&sel.c.size===1?[...sel.c][0]:null; const code=one&&state.custInfo[one]?.code;
      const name=`${iso(new Date())} Open projects report${one?" "+(code||one):""}.${pdf?"pdf":"xlsx"}`.replace(/[\\/:*?"<>|_]/g," ");
      const text=full?"Full report: all open projects":desc();
      let blob;
      if(pdf) blob=(await buildReportPDF(ps,text,one)).output("blob");
      else { const wb=await buildReport(ps,text,one); blob=new Blob([await wb.xlsx.writeBuffer()],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}); }
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
      close(); toast("Downloaded "+name);
    }catch(err){ console.error(err); toast("Couldn't build the report. Check your connection and try again."); } };
  $("#repGo").onclick=()=>go(!sel.c.size&&!sel.s.size&&!sel.w.size);
  drawFmt(); upd();
}
document.addEventListener("click",e=>{ if(e.target.closest&&e.target.closest("#repBtn")) openReportSheet(); });

const MS_LOGIN=false; // flips on once the Microsoft (Azure) connection is set up in Supabase
let lMode="in";
if(MS_LOGIN){ $("#lMs").hidden=false; $("#lOr").hidden=false; }
$("#lMs").onclick=async()=>{ const {error}=await sb.auth.signInWithOAuth({provider:"azure",options:{scopes:"email",redirectTo:location.origin+location.pathname}}); if(error) showLogin("Microsoft sign-in isn't available right now. Use email and password.",true); };
function showLogin(msg,err){ $("#lLogo").src=document.querySelector(".mark img").src; $("#login").hidden=false; if(msg){ $("#lMsg").textContent=msg; $("#lMsg").className=err?"err":""; } }
function goLabel(){ return lMode==="in"?"Sign in":lMode==="reset"?"Save password":"Create login"; }
function setMode(m){ lMode=m; const r=m==="reset";
  $("#lEmailL").hidden=r; $("#lEmail").required=!r; $("#lPass2L").hidden=!r; $("#lPass2").required=r; $("#lPass").minLength=r?8:6; $("#lPassT").textContent=r?"New password":"Password";
  $("#lForgot").hidden=m!=="in"; $("#lMode").hidden=r; $("#lMs").hidden=r||!MS_LOGIN; $("#lOr").hidden=r||!MS_LOGIN;
  if(r){ $("#lTitle").textContent="Set a new password"; $("#lGo").textContent=goLabel(); $("#lPass").autocomplete="new-password"; $("#lPass").value=""; $("#lPass2").value=""; $("#lMsg").className=""; $("#lMsg").textContent="Pick a new password (8+ characters)."; return; }
  $("#lTitle").textContent=m==="in"?"Sign in":"Create your login"; $("#lGo").textContent=m==="in"?"Sign in":"Create login"; $("#lMode").textContent=m==="in"?"First time here? Create your login":"Already have a login? Sign in"; $("#lPass").autocomplete=m==="in"?"current-password":"new-password"; $("#lMsg").className=""; $("#lMsg").textContent=m==="in"?"Use your Northeast email.":"Use your Northeast email and pick a password (6+ characters)."; }
$("#lMode").onclick=()=>setMode(lMode==="in"?"up":"in");
function cleanUrl(){ if(location.href.includes("#")||location.search) history.replaceState(null,"",location.pathname); }
function startReset(){ inReset=true; setMode("reset"); showLogin(); }
sb.auth.onAuthStateChange(ev=>{ if(ev==="PASSWORD_RECOVERY") startReset(); });
$("#lForgot").onclick=async()=>{ const em=$("#lEmail"), email=em.value.trim();
  if(!email||!em.checkValidity()){ showLogin("Type your email above, then tap Forgot password.",true); em.focus(); return; }
  const b=$("#lForgot"); b.disabled=true;
  try{ const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}); if(error) throw error;
    showLogin("Check your email for a reset link. It may land in junk."); }
  catch(err){ const m=String(err.message||err); showLogin(err.status===429||/rate limit|too many|seconds/i.test(m)?"Too many reset requests. Wait a few minutes, then try again.":"Couldn't send the reset email. Check the address and try again.",true); }
  finally{ b.disabled=false; } };
$("#lForm").addEventListener("submit",async e=>{ e.preventDefault(); const email=$("#lEmail").value.trim(), password=$("#lPass").value;
  if(lMode==="reset"){ const p2=$("#lPass2").value;
    if(password.length<8){ showLogin("Use at least 8 characters.",true); return; }
    if(password!==p2){ showLogin("Those passwords don't match.",true); return; } }
  $("#lGo").disabled=true; $("#lGo").textContent="One moment...";
  try{
    if(lMode==="reset"){ const {error}=await sb.auth.updateUser({password}); if(error) throw error;
      inReset=false; cleanUrl(); setMode("in"); showLogin("Password updated. Signing you in..."); toast("Password updated");
      await afterLogin(); return; }
    if(lMode==="up"){ const {data,error}=await sb.auth.signUp({email,password}); if(error) throw error;
      if(!data.session){ showLogin("Your login was created, but Supabase is asking to confirm the email first. Ask Lapp D to turn off email confirmation, then sign in.",true); setMode("in"); return; } }
    else { const {error}=await sb.auth.signInWithPassword({email,password}); if(error) throw error; }
    await afterLogin();
  }catch(err){ const m=String(err.message||err); if(lMode==="reset"){ showLogin(/session|expired|jwt/i.test(m)?"That reset link has expired. Close this and tap Forgot password again.":/different from the old/i.test(m)?"Pick a password different from your old one.":m,true); return; } showLogin(/Invalid login/i.test(m)?"That email and password don't match. First time? Tap Create your login.":/already registered/i.test(m)?"You already have a login. Sign in instead.":m,true); }
  finally{ $("#lGo").disabled=false; $("#lGo").textContent=goLabel(); }
});
async function afterLogin(){
  const {data:me,error}=await sb.rpc("my_member");
  if(error||!me){ await sb.auth.signOut(); showLogin("That email isn't on the team list yet. Ask Lapp D to add you.",true); return; }
  state.me=me; $("#login").hidden=true;
  if(AI_ON){ sampleFn=claudeFn; $("#aiOpen").hidden=false; }
  try{ await loadAll(); }catch(e){ console.error(e); toast("Couldn't load the projects. Check your connection."); }
  loadNotifs(); subscribe(); syncPushOnLogin();
}
document.addEventListener("click",async e=>{ if(e.target.id==="signOut"){ try{ if(pushSub){ const ep=pushSub.endpoint; await pushSub.unsubscribe(); await sb.from("push_subs").delete().eq("endpoint",ep); } }catch(err){} await sb.auth.signOut(); location.reload(); } });
(async()=>{ render(); const {data:{session}}=await sb.auth.getSession();
  if(inReset&&session){ startReset(); cleanUrl(); return; } // came from a reset email: ask for the new password before opening the app
  if(inReset||LINK_ERR){ inReset=false; cleanUrl(); }
  if(session) await afterLogin(); else if(LINK_ERR) showLogin("That reset link has expired or was already used. Type your email and tap Forgot password to get a new one.",true); else showLogin(); })();
</script>
