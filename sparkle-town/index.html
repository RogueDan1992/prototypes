<!DOCTYPE html>
<html lang="en">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sparkle Town</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sparkle Town">
<meta name="theme-color" content="#ff7ac6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
@font-face { font-family: "Fredoka"; font-weight: 600; font-display: swap; src: url(fonts/fredoka-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Fredoka"; font-weight: 700; font-display: swap; src: url(fonts/fredoka-latin-700-normal.woff2) format("woff2"); }
:root {
  --pink: #ff5fae; --pink2: #ff9ad0; --purple: #8f5cff; --blue: #4fb6ff; --yellow: #ffcf3f; --mint: #3fd6a0;
  --ink: #3d2763; --card: #ffffff;
  --big: clamp(22px, 4.2vmin, 40px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
html, body { margin: 0; height: 100%; overflow: hidden; touch-action: manipulation; }
body {
  font-family: "Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif; font-weight: 600;
  color: var(--ink); background: linear-gradient(180deg, #8ad8ff 0%, #c9e9ff 38%, #ffe0f3 72%, #fff4fa 100%);
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; padding: calc(env(safe-area-inset-top) + 78px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 14px); }
.screen.on { display: flex; animation: popin .35s ease; }
@keyframes popin { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }

/* scenery */
.scenery { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.sun { position: absolute; top: 10vmin; right: 6vmin; width: 14vmin; height: 14vmin; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #fff6b0, #ffd23f 55%, #ffb21f); box-shadow: 0 0 0 2.2vmin #ffe57a55, 0 0 0 4.4vmin #ffe57a33; }
@media (max-width: 600px) { .sun { top: calc(env(safe-area-inset-top) + 92px); width: 16vmin; height: 16vmin; } }
.music-on .sun { animation: sunbeat calc(var(--beat) * 2) ease-in-out infinite; }
@keyframes sunbeat { 50% { transform: scale(1.08); } }
.cloud { position: absolute; width: 22vmin; height: 7vmin; background: #fff; border-radius: 7vmin; opacity: .9; animation: drift 70s linear infinite; }
.cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
.cloud::before { width: 9vmin; height: 9vmin; left: 3vmin; top: -4.5vmin; }
.cloud::after { width: 11vmin; height: 11vmin; left: 9vmin; top: -6vmin; }
@keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }
.hills { position: absolute; left: -10vw; right: -10vw; bottom: -2vh; height: 20vh; }
.hill1 { position: absolute; left: 0; bottom: 0; width: 70vw; height: 18vh; background: #7fe0a0; border-radius: 50% 50% 0 0; }
.hill2 { position: absolute; right: 0; bottom: 0; width: 80vw; height: 14vh; background: #5fd08a; border-radius: 50% 50% 0 0; }
.flowers { position: absolute; left: 0; right: 0; bottom: 1vh; display: flex; justify-content: space-around; font-size: 4.5vmin; }
.music-on .flowers span { display: inline-block; animation: sway calc(var(--beat) * 2) ease-in-out infinite; }
.music-on .flowers span:nth-child(even) { animation-delay: calc(var(--beat) * -1); }
@keyframes sway { 50% { transform: rotate(12deg) translateY(-4px); } }
.note { position: fixed; z-index: 5; pointer-events: none; font-size: clamp(26px, 5vmin, 44px); animation: rise 3.2s ease-out forwards; }
@keyframes rise { 0% { transform: translate(0, 0) rotate(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--dx), -55vh) rotate(var(--r)); opacity: 0; } }

/* top bar */
#top { position: fixed; z-index: 20; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 12px) 8px calc(env(safe-area-inset-left) + 12px); }
.round { width: 60px; height: 60px; border-radius: 50%; background: var(--card); box-shadow: 0 4px 0 #d9c9f2, 0 8px 16px #6b3c9a22; display: grid; place-items: center; font-size: 30px; flex: none; transition: transform .15s; }
.round:active { transform: scale(.9); }
.round.off { opacity: .45; }
#homeBtn.hide { visibility: hidden; }
#piggy { display: flex; align-items: center; gap: 6px; padding: 6px 18px 6px 10px; border-radius: 40px; background: var(--card); box-shadow: 0 4px 0 #ffc6e3, 0 8px 16px #6b3c9a22; font-size: 34px; font-weight: 700; }
#piggy .pig { font-size: 40px; }
#piggy.bump { animation: bump .45s; }
@keyframes bump { 40% { transform: scale(1.2); } }
.spacer { flex: 1; }
#parentBtn { font-size: 22px; width: 46px; height: 46px; opacity: .6; }
@media (max-width: 420px) { .round { width: 52px; height: 52px; font-size: 26px; } #piggy { font-size: 28px; padding: 4px 14px 4px 8px; } #piggy .pig { font-size: 32px; } #top { gap: 6px; } }

/* coins */
.coin { display: inline-grid; place-items: center; width: 1.1em; height: 1.1em; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff7c2, var(--yellow) 45%, #e89b00); box-shadow: inset 0 -3px 0 #c97f00; color: #a35f00; font-weight: 700; font-size: .9em; line-height: 1; }
.coin::after { content: "★"; font-size: .6em; }
.coins { display: inline-flex; gap: 3px; flex-wrap: wrap; justify-content: center; }

/* home */
#home { justify-content: center; align-items: center; }
.title { position: relative; font-size: clamp(42px, 9vmin, 96px); font-weight: 700; margin: 0; letter-spacing: .01em; line-height: 1.05;
  background: linear-gradient(90deg, #ff4f9a, #ff8a3d, #ffc93c, #3fd6a0, #4fb6ff, #8f5cff); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 #fff) drop-shadow(0 6px 10px #8f5cff44); }
.title-wrap { position: relative; text-align: center; margin-bottom: 1vmin; }
.title-wrap .tw { position: absolute; font-size: clamp(22px, 4vmin, 40px); animation: twinkle 1.6s ease-in-out infinite; }
@keyframes twinkle { 50% { transform: scale(.6) rotate(20deg); opacity: .5; } }
.hello { font-size: var(--big); margin: 1vmin 0 3vmin; text-align: center; background: #ffffffcc; padding: .2em .9em; border-radius: 30px; }
.town { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3vmin; width: min(92vw, 820px); }
@media (min-aspect-ratio: 4/3) { .town { grid-template-columns: repeat(4, minmax(0, 1fr)); width: min(96vw, 1120px); } }
.place { position: relative; border-radius: 34px; padding: 2.6vmin 1vmin 2vmin; display: flex; flex-direction: column; align-items: center; gap: 1.2vmin; box-shadow: 0 8px 0 var(--edge), 0 14px 24px #6b3c9a2e; transition: transform .2s; background: var(--bg); }
.place::before { content: ""; position: absolute; inset: 8px 8px auto 8px; height: 40%; border-radius: 26px 26px 50% 50%; background: linear-gradient(#ffffff88, #ffffff00); pointer-events: none; }
.place:active { transform: scale(.94) !important; }
.beat .place:nth-child(odd), .beat2 .place:nth-child(even) { transform: translateY(-8px) scale(1.03); }
.place .ico { font-size: clamp(66px, 14vmin, 132px); line-height: 1; filter: drop-shadow(0 6px 6px #0002); }
.place .lbl { font-size: var(--big); font-weight: 700; color: #fff; background: #0000001f; padding: .1em .8em; border-radius: 20px; text-shadow: 0 2px 0 #0002; }
.place.shop { --bg: linear-gradient(160deg, #ffb3da, #ff5fae); --edge: #d93b8a; }
.place.sit { --bg: linear-gradient(160deg, #b6e3ff, #4fb6ff); --edge: #2f8fd6; }
.place.abc { --bg: linear-gradient(160deg, #ffe58a, #ffb83f); --edge: #e0902a; }
.place.dress { --bg: linear-gradient(160deg, #d6c2ff, #8f5cff); --edge: #6b3ad6; }
.stickers { margin-top: 3vmin; font-size: clamp(26px, 5vmin, 44px); min-height: 1.2em; text-align: center; max-width: 92vw; background: #ffffffaa; border-radius: 24px; padding: 0 .4em; }
.stickers:empty { background: none; }

/* panels */
.panel { background: #ffffffee; border-radius: 32px; box-shadow: 0 6px 0 #e8dcff, 0 12px 24px #6b3c9a1f; padding: 2vmin; }
.stage { flex: 1; display: flex; gap: 2vmin; min-height: 0; }
@media (max-aspect-ratio: 1/1) { .stage { flex-direction: column; } }
.prompt { font-size: var(--big); font-weight: 700; text-align: center; margin: 0 0 1.5vmin; }
.prompt.pill { align-self: center; background: #ffffffd9; padding: .15em .9em; border-radius: 30px; }
.bigbtn { font-size: var(--big); font-weight: 700; padding: .45em 1.1em; border-radius: 40px; background: linear-gradient(180deg, #ff9ad0, var(--pink)); color: #fff; box-shadow: 0 6px 0 #c93e8a; text-shadow: 0 2px 0 #0002; }
.bigbtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c93e8a; }
.bigbtn.green { background: linear-gradient(180deg, #8ef0b8, #2fc77a); box-shadow: 0 6px 0 #1f8e55; }
.bigbtn.green:active { box-shadow: 0 2px 0 #1f8e55; }
.drag { touch-action: none; cursor: grab; }
.sel { outline: 6px solid var(--yellow); outline-offset: 2px; animation: wiggle .5s ease-in-out infinite; }
@keyframes wiggle { 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }
.hint { animation: pulse .7s ease-in-out 3; }
@keyframes pulse { 50% { transform: scale(1.18); box-shadow: 0 0 0 10px #ffcf3f88; } }
.ghost { position: fixed; z-index: 100; pointer-events: none; transform: translate(-50%, -50%) scale(1.15); font-size: clamp(60px, 12vmin, 110px); filter: drop-shadow(0 10px 10px #0003); }
.over { box-shadow: 0 0 0 8px var(--yellow) !important; }

/* shop */
.shelf { flex: 3; display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(96px, 17vmin, 150px), 1fr)); gap: 1.6vmin; align-content: start; overflow-y: auto; }
.item { border-radius: 24px; background: linear-gradient(180deg, #fff, #fff4fa); box-shadow: 0 5px 0 #ffd3ea; display: flex; flex-direction: column; align-items: center; padding: 1vmin .5vmin 1.2vmin; border: 3px solid #ffe1f2; }
.item .e { font-size: clamp(48px, 10vmin, 86px); line-height: 1.1; }
.item .coins { font-size: clamp(18px, 3.4vmin, 28px); }
.item.owned { opacity: .45; }
.basket { flex: 2; display: flex; flex-direction: column; align-items: center; justify-content: space-between; border: 6px dashed var(--pink2); }
.basket .bk { font-size: clamp(70px, 15vmin, 140px); }
.basket .inbk { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; font-size: clamp(40px, 8vmin, 72px); min-height: 1.3em; }
.basket .total { font-size: var(--big); font-weight: 700; display: flex; align-items: center; gap: 10px; }

/* babysit */
.nursery { flex: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; background: linear-gradient(180deg, #e3f4ff, #fff); }
.baby { position: relative; font-size: clamp(120px, 30vmin, 280px); line-height: 1; transition: transform .2s; border-radius: 50%; padding: 1vmin; }
.mood { position: absolute; right: -6%; bottom: 4%; font-size: .38em; }
.fuss { animation: fuss .6s ease-in-out infinite; } @keyframes fuss { 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
.music-on .baby:not(.fuss) { animation: rock calc(var(--beat) * 2) ease-in-out infinite; } @keyframes rock { 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
.need { position: absolute; top: 4%; right: 8%; font-size: clamp(56px, 12vmin, 110px); background: #fff; border-radius: 50%; width: 1.5em; height: 1.5em; display: grid; place-items: center; box-shadow: 0 6px 18px #0002; animation: bob 1.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.need::after { content: ""; position: absolute; left: 6%; bottom: -6%; width: 22%; height: 22%; background: #fff; border-radius: 50%; }
.meter { display: flex; gap: 8px; font-size: clamp(32px, 6vmin, 56px); margin-top: 1vmin; }
.tools { flex: 2; display: grid; grid-template-columns: repeat(auto-fit, minmax(clamp(90px, 15vmin, 140px), 1fr)); gap: 1.6vmin; align-content: center; }
.tool { border-radius: 26px; background: linear-gradient(180deg, #fff, #f0f9ff); box-shadow: 0 5px 0 #cfeaff; font-size: clamp(56px, 11vmin, 100px); padding: 1.5vmin 0; text-align: center; border: 3px solid #d6efff; }

/* abc */
.abcwrap { flex: 1; display: flex; gap: 3vmin; align-items: stretch; justify-content: center; }
@media (max-aspect-ratio: 1/1) { .abcwrap { flex-direction: column; } }
.col { flex: 1; display: flex; flex-direction: column; gap: 2vmin; justify-content: center; }
@media (max-aspect-ratio: 1/1) { .col { flex-direction: row; } }
.letter { flex: 1; border-radius: 28px; background: linear-gradient(180deg, #fff, #fff1c4); border: 4px solid #ffd76a; box-shadow: 0 6px 0 #e7b93d; font-size: clamp(64px, 13vmin, 130px); font-weight: 700; display: grid; place-items: center; color: var(--purple); min-height: 1.4em; }
.letter.done { visibility: hidden; }
.pic { flex: 1; border-radius: 28px; background: #fff; border: 5px dashed #c7a7ff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: clamp(56px, 12vmin, 120px); min-height: 1.6em; position: relative; }
.pic .tag { position: absolute; top: 6px; left: 12px; font-size: .45em; font-weight: 700; color: var(--purple); }
.pic.done { border-style: solid; border-color: var(--mint); background: #ecfff6; }

/* dress up */
.dressroom { flex: 3; display: flex; align-items: center; justify-content: center; position: relative; background: radial-gradient(circle at 50% 38%, #fff 0%, #fbe9ff 55%, #eadcff 100%); overflow: hidden; }
.dressroom::before { content: ""; position: absolute; left: 50%; bottom: 3%; width: 70%; height: 10%; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(#ffffffcc, #ffffff00 70%); }
#doll { height: 100%; max-height: 72vh; width: auto; max-width: 100%; position: relative; transform-origin: 50% 95%; }
.music-on #doll { animation: dance calc(var(--beat) * 2) ease-in-out infinite; }
@keyframes dance { 25% { transform: rotate(-3deg) translateY(-6px); } 50% { transform: none; } 75% { transform: rotate(3deg) translateY(-6px); } }
.closet { flex: 2; display: flex; flex-direction: column; gap: 1.6vmin; overflow-y: auto; }
.row { display: flex; flex-wrap: wrap; gap: 1.2vmin; justify-content: center; }
.sw { position: relative; width: clamp(52px, 9vmin, 80px); height: clamp(52px, 9vmin, 80px); border-radius: 50%; border: 5px solid #fff; box-shadow: 0 4px 10px #0002; }
.acc { position: relative; width: clamp(64px, 11vmin, 96px); height: clamp(64px, 11vmin, 96px); border-radius: 22px; background: #fff; box-shadow: 0 4px 10px #0002; font-size: clamp(40px, 7vmin, 64px); display: grid; place-items: center; border: 4px solid #eadcff; }
.acc.on, .sw.on { border-color: var(--yellow); }
.acc.locked { opacity: .4; }
.lock { position: absolute; right: -4px; bottom: -4px; font-size: 20px; }
@media (max-aspect-ratio: 1/1) { .dressroom { flex: 1.1; } #doll { max-height: 38vh; } .closet { flex: 1.5; } .closet .prompt { font-size: 22px; } }
.flash { position: fixed; inset: 0; background: #fff; z-index: 90; animation: flash .5s forwards; pointer-events: none; }
@keyframes flash { to { opacity: 0; } }

/* overlays */
#burst { position: fixed; inset: 0; pointer-events: none; z-index: 80; overflow: hidden; }
.bit { position: absolute; font-size: 34px; animation: fly 1.4s ease-out forwards; }
@keyframes fly { to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }
.flycoin { position: fixed; z-index: 85; font-size: 44px; transition: transform .7s cubic-bezier(.5,-0.3,.6,1); pointer-events: none; }
#modal { position: fixed; inset: 0; z-index: 70; background: #3d276388; display: none; align-items: center; justify-content: center; padding: 20px; }
#modal.on { display: flex; }
#modal .box { background: #fff; border-radius: 34px; padding: 4vmin; max-width: 640px; width: 100%; text-align: center; box-shadow: 0 8px 0 #e8dcff, 0 20px 50px #0004; animation: popin .3s; }
#modal h2 { font-size: clamp(30px, 6vmin, 52px); margin: 0 0 2vmin; font-weight: 700; }
#modal .em { font-size: clamp(80px, 18vmin, 160px); line-height: 1.1; }
#modal input { font: inherit; font-size: var(--big); padding: .4em .6em; border-radius: 20px; border: 4px solid #ffb6dd; width: 100%; text-align: center; margin: 1vmin 0 3vmin; color: var(--ink); -webkit-user-select: text; user-select: text; }
#modal .btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 2vmin; }
#modal .small { font-size: 18px; padding: 10px 18px; border-radius: 20px; background: #f1e8ff; }
#modal p { font-size: 20px; }
#update { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 16px); transform: translateX(-50%); z-index: 95; display: none; }
#update.on { display: block; }
</style>
</head>
<body style="--beat: .577s">
<div class="scenery">
  <div class="sun"></div>
  <div class="cloud" style="top:9vh"></div>
  <div class="cloud" style="top:22vh; animation-duration:95s; animation-delay:-50s"></div>
  <div class="hills"><div class="hill1"></div><div class="hill2"></div></div>
  <div class="flowers"><span>🌷</span><span>🌼</span><span>🌸</span><span>🌻</span><span>🌷</span><span>🌼</span><span>🌸</span></div>
</div>

<div id="top">
  <button class="round" id="homeBtn" aria-label="Home">🏠</button>
  <div id="piggy" aria-label="Coins"><span class="pig">🐷</span><span class="coin"></span><span id="coinCount">0</span></div>
  <div class="spacer"></div>
  <button class="round" id="musicBtn" aria-label="Music">🎵</button>
  <button class="round" id="soundBtn" aria-label="Voice and sounds">🔊</button>
  <button class="round" id="parentBtn" aria-label="Grown-ups">⚙️</button>
</div>

<section class="screen on" id="home">
  <div class="title-wrap"><h1 class="title">Sparkle Town</h1><span class="tw" style="left:-6%;top:-20%">✨</span><span class="tw" style="right:-5%;top:-10%;animation-delay:.6s">⭐</span><span class="tw" style="right:12%;bottom:-30%;animation-delay:1.1s">✨</span></div>
  <p class="hello" id="hello"></p>
  <div class="town">
    <button class="place shop" data-go="shop"><span class="ico">🛍️</span><span class="lbl">Shop</span></button>
    <button class="place sit" data-go="babysit"><span class="ico">👶</span><span class="lbl">Babysit</span></button>
    <button class="place abc" data-go="abc"><span class="ico">🔤</span><span class="lbl">ABC</span></button>
    <button class="place dress" data-go="dress"><span class="ico">👗</span><span class="lbl">Dress Up</span></button>
  </div>
  <div class="stickers" id="stickers"></div>
</section>

<section class="screen" id="shop">
  <p class="prompt pill">🛍️ Drag it into the basket!</p>
  <div class="stage">
    <div class="shelf panel" id="shelf"></div>
    <div class="basket panel" data-drop="basket" id="basket">
      <div class="bk">🧺</div>
      <div class="inbk" id="inBasket"></div>
      <div class="total" id="total"></div>
      <button class="bigbtn green" id="payBtn">Pay 💳</button>
    </div>
  </div>
</section>

<section class="screen" id="babysit">
  <p class="prompt pill">👶 What does the baby need?</p>
  <div class="stage">
    <div class="nursery panel">
      <div class="baby" data-drop="baby" id="baby">👶<span class="mood" id="mood"></span></div>
      <div class="need" id="need">🍼</div>
      <div class="meter" id="meter"></div>
    </div>
    <div class="tools panel" id="tools"></div>
  </div>
</section>

<section class="screen" id="abc">
  <p class="prompt pill">🔤 Drag each letter to its picture!</p>
  <div class="abcwrap">
    <div class="col" id="letters"></div>
    <div class="col" id="pics"></div>
  </div>
</section>

<section class="screen" id="dress">
  <div class="stage">
    <div class="dressroom panel" data-drop="doll" id="dollWrap">
      <svg id="doll" viewBox="0 0 300 460" aria-label="Doll"></svg>
    </div>
    <div class="closet panel">
      <p class="prompt" style="margin:0">Hair</p><div class="row" id="hairRow"></div>
      <p class="prompt" style="margin:0">Dress</p><div class="row" id="dressRow"></div>
      <p class="prompt" style="margin:0">Extras</p><div class="row" id="accRow"></div>
      <div class="row"><button class="bigbtn" id="photoBtn">📸 Photo</button></div>
    </div>
  </div>
</section>

<div id="burst"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<button class="bigbtn green" id="update">✨ New version! Tap to update</button>

<script>
/* Every spoken line. Recorded clips live in voice/<id>.m4a; if a clip is missing the device voice reads the text. */
var LINES = {
  hello: "Welcome to Sparkle Town! Where do you want to go?",
  pl_shop: "Shop!", pl_babysit: "Babysitting!", pl_abc: "A, B, C!", pl_dress: "Dress up!",
