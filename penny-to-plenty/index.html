<!DOCTYPE html>
<html lang="en">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Penny to Plenty">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1420">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Penny to Plenty: Build Your Future</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #0d1420; --panel: rgba(14, 22, 36, 0.92); --panel-solid: #121c2d; --card: rgba(255, 255, 255, 0.06); --card2: rgba(255, 255, 255, 0.1);
  --line: rgba(255, 255, 255, 0.14); --text: #f4f7fb; --muted: #a9b6c9; --gold: #f6c453; --gold2: #e8a623; --green: #39c27a; --red: #ff6b6b; --blue: #4ea1ff; --purple: #b28dff;
  --radius: 16px; --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; font-size: 17px; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:disabled { cursor: not-allowed; }
.hidden { display: none !important; }
.screen { position: fixed; inset: 0; display: none; }
.screen.active { display: block; }
.muted { color: var(--muted); }
.good { color: var(--green); } .bad { color: var(--red); } .gold { color: var(--gold); }
small { font-size: 0.82em; }
h1, h2, h3, h4 { margin: 0 0 8px; line-height: 1.15; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 18px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line); font-weight: 700; transition: transform .08s, background .15s, box-shadow .15s; min-height: 46px; }
.btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.18); transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; }
.btn.primary { background: linear-gradient(180deg, #4ea1ff, #2f6fd6); border-color: #6fb4ff; box-shadow: 0 4px 14px rgba(47, 111, 214, .45); }
.btn.gold { background: linear-gradient(180deg, #ffd66e, #e8a623); color: #2b1d00; border-color: #ffe39c; box-shadow: 0 4px 16px rgba(232, 166, 35, .45); }
.btn.green { background: linear-gradient(180deg, #4ad48a, #23a35f); border-color: #74e4a6; }
.btn.red { background: linear-gradient(180deg, #ff7f7f, #d94545); border-color: #ff9d9d; }
.btn.small { padding: 7px 12px; min-height: 36px; font-size: 0.9em; border-radius: 10px; }
.btn.big { padding: 18px 28px; font-size: 1.25em; border-radius: 16px; }
.btn.block { width: 100%; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

/* ---------- title screen ---------- */
#screen-title .bgscene, #screen-game .scene, .bgscene { position: absolute; inset: 0; overflow: hidden; }
.bgscene svg, .scene svg { width: 100%; height: 100%; display: block; }
.title-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(ellipse at center, rgba(5, 10, 20, 0.35), rgba(5, 10, 20, 0.8)); overflow-y: auto; }
.logo { font-size: clamp(48px, 9vw, 112px); font-weight: 900; letter-spacing: 0.06em; margin: 0; text-shadow: 0 6px 30px rgba(0, 0, 0, .6); background: linear-gradient(180deg, #fff 30%, #ffd66e); -webkit-background-clip: text; background-clip: text; color: transparent; text-align: center; }
.tagline { font-size: clamp(18px, 2.4vw, 28px); margin: 4px 0 28px; color: #ffe7b0; letter-spacing: 0.08em; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0, 0, 0, .7); text-align: center; }
.player-cards { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; }
.pcard { width: 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); text-align: center; }
.pcard .avatar { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 900; border: 3px solid #fff3; }
.pcard .sub { color: var(--muted); min-height: 44px; font-size: 0.9em; }
.title-links { margin-top: 22px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

/* ---------- game screen ---------- */
.topbar { position: absolute; left: 0; right: 0; top: 0; height: 66px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: linear-gradient(180deg, rgba(8, 13, 22, .92), rgba(8, 13, 22, .75)); border-bottom: 1px solid var(--line); z-index: 20; backdrop-filter: blur(6px); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--card2); border: 1px solid var(--line); white-space: nowrap; font-weight: 600; font-size: 0.95em; }
.chip.money { background: rgba(57, 194, 122, .18); border-color: rgba(57, 194, 122, .5); font-size: 1.15em; font-weight: 800; }
.chip.name { font-weight: 900; }
.tb-info { flex: 1; min-width: 0; display: flex; gap: 8px; align-items: center; overflow-x: auto; scrollbar-width: none; }
.tb-info::-webkit-scrollbar { display: none; }
.tb-actions { flex-shrink: 0; display: flex; gap: 8px; }
@media (max-width: 1200px) { .wide-only { display: none; } }
.energy { width: 70px; height: 10px; border-radius: 6px; background: #0006; overflow: hidden; display: inline-block; }
.energy i { display: block; height: 100%; background: linear-gradient(90deg, #ffb347, #39c27a); }
.sidenav { position: absolute; left: 10px; top: 80px; display: flex; flex-direction: column; gap: 8px; z-index: 15; }
.navbtn { width: 92px; padding: 10px 4px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.78em; font-weight: 700; box-shadow: var(--shadow); }
.navbtn .ic { font-size: 26px; }
.navbtn:hover, .navbtn.on { background: rgba(78, 161, 255, .3); border-color: #6fb4ff; }
.navbtn.future { background: linear-gradient(180deg, rgba(255, 214, 110, .35), rgba(232, 166, 35, .3)); border-color: #ffd66e; }

.decision { position: absolute; left: 50%; transform: translateX(-50%); bottom: 12px; width: min(980px, calc(100% - 130px)); margin-left: 52px; max-height: 46vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 16px 18px; box-shadow: var(--shadow); z-index: 14; backdrop-filter: blur(8px); }
.decision h2 { font-size: 1.35em; }
.decision .story { font-size: 1.08em; line-height: 1.45; margin-bottom: 12px; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.choice { text-align: left; padding: 14px; border-radius: 14px; background: linear-gradient(180deg, rgba(78, 161, 255, .22), rgba(78, 161, 255, .1)); border: 2px solid rgba(111, 180, 255, .55); display: flex; flex-direction: column; gap: 4px; min-height: 86px; transition: transform .08s, background .15s; }
.choice:hover:not(:disabled) { background: rgba(78, 161, 255, .38); transform: translateY(-2px); }
.choice .lbl { font-size: 1.12em; font-weight: 800; }
.choice .key { display: inline-block; width: 24px; height: 24px; border-radius: 6px; background: #fff2; text-align: center; font-size: 0.8em; line-height: 24px; margin-right: 6px; }
.choice .det { color: #d6e4f7; font-size: 0.92em; }
.choice .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
.tag { font-size: 0.75em; padding: 2px 8px; border-radius: 999px; background: #0005; border: 1px solid var(--line); }
.tag.risk { background: rgba(255, 107, 107, .25); border-color: rgba(255, 107, 107, .6); }
.choice:disabled { background: rgba(255, 255, 255, .04); border-color: var(--line); }
.choice .why { color: #ffb4b4; font-size: 0.85em; font-weight: 700; }
.quick { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
.deltas { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.delta { padding: 5px 10px; border-radius: 999px; font-weight: 700; font-size: 0.92em; background: var(--card2); border: 1px solid var(--line); }
.delta.up { background: rgba(57, 194, 122, .2); border-color: rgba(57, 194, 122, .6); }
.delta.down { background: rgba(255, 107, 107, .2); border-color: rgba(255, 107, 107, .6); }
.lesson { margin-top: 10px; padding: 10px 14px; border-radius: 12px; background: rgba(246, 196, 83, .14); border: 1px solid rgba(246, 196, 83, .45); color: #ffe7b0; }
.result-title { font-size: 1.5em; font-weight: 900; }
.result-title.good { color: #6ff0a7; } .result-title.bad { color: #ff9d9d; }
.banner { margin-top: 10px; padding: 10px 14px; border-radius: 12px; background: linear-gradient(90deg, rgba(178, 141, 255, .3), rgba(78, 161, 255, .2)); border: 1px solid rgba(178, 141, 255, .6); font-weight: 700; }

/* ---------- drawer panels ---------- */
.drawer { position: absolute; top: 66px; right: 0; bottom: 0; width: min(720px, 100%); background: var(--panel-solid); border-left: 1px solid var(--line); z-index: 30; overflow-y: auto; padding: 18px 20px 40px; box-shadow: -10px 0 40px rgba(0, 0, 0, .5); animation: slidein .18s ease-out; }
.drawer.wide { width: min(1200px, 100%); }
@keyframes slidein { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.drawer h2 { font-size: 1.6em; }
.drawer h3 { margin-top: 18px; font-size: 1.15em; color: #cfe3ff; }
.close-x { position: sticky; top: 0; float: right; z-index: 2; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.stat .k { color: var(--muted); font-size: 0.85em; }
.stat .v { font-size: 1.4em; font-weight: 900; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 10px 0; }
.card.owned { border-color: rgba(57, 194, 122, .6); }
.card h4 { font-size: 1.1em; }
.formula { font-family: ui-monospace, Menlo, monospace; background: #0005; padding: 10px 12px; border-radius: 10px; font-size: 0.92em; overflow-x: auto; }
.bars { display: flex; gap: 6px; align-items: flex-end; height: 120px; padding: 8px; background: #0004; border-radius: 12px; }
.bars .day { flex: 1; display: flex; gap: 2px; align-items: flex-end; height: 100%; position: relative; }
.bars .day i { flex: 1; border-radius: 4px 4px 0 0; min-height: 2px; }
.bars .day i.in { background: var(--green); } .bars .day i.out { background: var(--red); }
.bars .day span { position: absolute; bottom: -20px; left: 0; right: 0; text-align: center; font-size: 0.7em; color: var(--muted); }
.legend { font-size: 0.85em; color: var(--muted); margin-top: 24px; }
.hist { max-height: 260px; overflow-y: auto; font-size: 0.9em; }
.hist div { padding: 4px 0; border-bottom: 1px solid #ffffff10; display: flex; justify-content: space-between; gap: 10px; }
.skillbar { height: 10px; border-radius: 6px; background: #0006; overflow: hidden; }
.skillbar i { display: block; height: 100%; background: linear-gradient(90deg, #4ea1ff, #b28dff); }
.req { color: #ffb4b4; font-size: 0.85em; font-weight: 700; }
.mapbox { width: 100%; aspect-ratio: 16/9; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #0b2238; }
.mapbox svg { width: 100%; height: 100%; display: block; }
.mapbox .map-place { cursor: pointer; }
.mapbox .map-place:hover { filter: brightness(1.25); }
.minibars { display: flex; gap: 2px; align-items: flex-end; height: 36px; }
.minibars i { width: 8px; border-radius: 2px; }

/* ---------- modal ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { width: min(640px, 100%); max-height: 90vh; overflow-y: auto; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 20px; padding: 22px; box-shadow: var(--shadow); animation: pop .18s ease-out; }
.modal.wide { width: min(860px, 100%); }
@keyframes pop { from { transform: scale(.95); opacity: 0; } to { transform: none; opacity: 1; } }
.lines div { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px solid #ffffff10; }
.warn { padding: 8px 12px; border-radius: 10px; background: rgba(255, 107, 107, .15); border: 1px solid rgba(255, 107, 107, .5); margin: 6px 0; }
.event { padding: 12px 14px; border-radius: 14px; background: rgba(78, 161, 255, .15); border: 1px solid rgba(78, 161, 255, .5); margin: 10px 0; }
.opt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0 14px; }
.opt button { padding: 12px 8px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); font-weight: 700; }
.opt button.on { border-color: var(--gold); background: rgba(246, 196, 83, .2); }
.receipt { font-family: ui-monospace, Menlo, monospace; background: #fffdf5; color: #222; border-radius: 10px; padding: 14px 16px; font-size: 0.95em; }
.receipt div { display: flex; justify-content: space-between; padding: 2px 0; }
.receipt .tot { border-top: 2px dashed #999; margin-top: 6px; padding-top: 6px; font-weight: 900; }

/* ---------- future & compare ---------- */
.page { position: absolute; inset: 0; overflow-y: auto; padding: 18px 20px 60px; background: radial-gradient(ellipse at top, #1d2b45, #0b111c 70%); }
.page-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.page-head h1 { font-size: clamp(24px, 3.4vw, 40px); }
.future-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.fcard { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
.fcard.likely { border-color: #6fb4ff; box-shadow: 0 0 0 2px rgba(78, 161, 255, .35); }
.fcard .pic { aspect-ratio: 16/9; overflow: hidden; background: #000; }
.fcard .pic svg { width: 100%; height: 100%; display: block; }
.fcard .body { padding: 14px; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid #ffffff10; font-size: 0.95em; }
.kv b { text-align: right; }
.nowbox { display: grid; grid-template-columns: minmax(260px, 1fr) 2fr; gap: 16px; margin-bottom: 16px; }
.nowbox .pic { border-radius: 16px; overflow: hidden; aspect-ratio: 16/9; border: 1px solid var(--line); }
.nowbox .pic svg { width: 100%; height: 100%; display: block; }
.chart svg { width: 100%; height: auto; display: block; }
.compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.compare-col { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.compare-col .pic { aspect-ratio: 16/9; overflow: hidden; }
.compare-col .pic svg { width: 100%; height: 100%; display: block; }
.compare-col .body { padding: 14px; }
.strength { padding: 8px 12px; border-radius: 10px; background: rgba(57, 194, 122, .15); border: 1px solid rgba(57, 194, 122, .45); margin: 6px 0; }
details { margin: 10px 0; } summary { cursor: pointer; font-weight: 700; color: #cfe3ff; }

.toasts { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: #101a2bf0; border: 1px solid var(--line); padding: 10px 16px; border-radius: 12px; box-shadow: var(--shadow); font-weight: 700; animation: pop .2s ease-out; }
.toast.ach { border-color: var(--gold); background: #2b2106f0; }

@media (max-width: 820px) {
  html, body { font-size: 15px; }
  .sidenav { flex-direction: row; top: auto; bottom: 0; left: 0; right: 0; justify-content: space-around; background: var(--panel-solid); padding: 6px; border-top: 1px solid var(--line); }
  .navbtn { width: auto; flex: 1; box-shadow: none; }
  .decision { width: calc(100% - 16px); margin-left: 0; bottom: 78px; max-height: 52vh; }
  .drawer { bottom: 70px; }
  .compare-grid, .nowbox { grid-template-columns: 1fr; }
}

/* ---------- Phase 2 effects ---------- */
.scene-layer { position: absolute; inset: 0; }
.scene-layer svg { width: 100%; height: 100%; display: block; }
.scene .pl { will-change: transform; }
.scene-layer.scene-in.fade { animation: sceneFadeIn .8s ease both; }
.scene-layer.scene-out.fade { animation: sceneFadeOut .8s ease both; }
.scene-layer.scene-in.travel { animation: travelIn .75s cubic-bezier(.2,.7,.2,1) both; }
.scene-layer.scene-out.travel { animation: travelOut .6s ease both; }
@keyframes sceneFadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes sceneFadeOut { from { opacity: 1; } to { opacity: 0; } }
@keyframes travelIn { from { opacity: 0; transform: scale(1.08); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes travelOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(.96); filter: blur(4px); } }
#scene [data-hotspot] { cursor: pointer; transition: filter .15s; }
#scene [data-hotspot]:hover { filter: brightness(1.15) drop-shadow(0 0 10px rgba(255, 220, 120, .9)); }
.hs-tip { position: fixed; z-index: 70; display: none; pointer-events: none; padding: 6px 12px; border-radius: 10px; background: #0d1626ee; border: 1px solid var(--gold); color: #ffe7b0; font-weight: 800; font-size: .9em; box-shadow: var(--shadow); }
.sleep-overlay { position: fixed; inset: 0; z-index: 80; pointer-events: auto; animation: dusk 1.2s ease both; background: linear-gradient(180deg, #050816, #121a3a 60%, #2a2140); }
.sleep-overlay.waking { animation: dawn 1.1s ease both; }
@keyframes dusk { from { opacity: 0; } to { opacity: 1; } }
@keyframes dawn { 0% { opacity: 1; } 40% { opacity: 1; background: linear-gradient(180deg, #2a3b6e, #e9a46b 80%, #ffd27a); } 100% { opacity: 0; background: linear-gradient(180deg, #8ec5ff, #ffe1a8); } }
.sleep-sky { position: absolute; inset: 0; }
.sleep-sky .moon { position: absolute; right: 18%; top: 14%; width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fffbe8, #e8e1c4 60%, #b9b39a); box-shadow: 0 0 60px 20px rgba(255, 250, 220, .25); animation: moonRise 1.4s ease both; }
@keyframes moonRise { from { transform: translateY(60px); opacity: 0; } to { transform: none; opacity: 1; } }
.sleep-sky .star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; opacity: 0; animation: twinkle 1.6s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: .1; } 50% { opacity: 1; } }
.sleep-text { position: absolute; left: 0; right: 0; top: 44%; text-align: center; font-size: clamp(36px, 6vw, 72px); font-weight: 900; color: #fff; letter-spacing: .08em; text-shadow: 0 4px 30px rgba(120, 160, 255, .6); animation: dayIn 1.2s .3s ease both; }
.sleep-text::before { content: '💤 '; }
@keyframes dayIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.float-text { position: fixed; z-index: 75; pointer-events: none; font-weight: 900; font-size: 1.4em; text-shadow: 0 2px 8px #000a; animation: floatUp 1.4s ease-out both; }
.float-text.up { color: #6ff0a7; } .float-text.down { color: #ff9d9d; }
@keyframes floatUp { from { opacity: 0; transform: translateY(10px) scale(.8); } 15% { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-40px); } }
.coin { position: fixed; z-index: 76; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at 35% 30%, #fff6c8, #f6c453 45%, #c98b14); box-shadow: inset 0 -2px 0 #9a6a0d, 0 2px 6px #0007; }
.chip.money.cash-up { animation: cashPulse .6s ease; } .chip.money.cash-down { animation: cashPulseDown .6s ease; }
@keyframes cashPulse { 40% { transform: scale(1.12); box-shadow: 0 0 18px rgba(57, 194, 122, .8); } }
@keyframes cashPulseDown { 40% { transform: scale(.95); box-shadow: 0 0 18px rgba(255, 107, 107, .8); } }
.confetti { position: fixed; inset: 0; z-index: 79; pointer-events: none; }
.talk { display: grid; grid-template-columns: 180px 1fr; gap: 16px; align-items: center; margin-bottom: 12px; }
.talk .portrait { width: 180px; height: 153px; background: radial-gradient(ellipse at 50% 40%, #2c4466, #121c2d); border-radius: 16px; border: 1px solid var(--line); }
@media (max-width: 600px) { .talk { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .scene-layer, .sleep-overlay, .float-text { animation: none !important; } }

.topbar .chip.money, .topbar .chip.name { flex-shrink: 0; }
@media (max-width: 820px) {
  .tb-actions .lbl { display: none; }
  .tb-actions .btn { padding: 7px 10px; font-size: 1.1em; }
  .topbar { gap: 6px; padding: 8px; }
}

.beforeafter { position: relative; aspect-ratio: 16/7; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); margin-bottom: 16px; box-shadow: var(--shadow); }
.ba-pic { position: absolute; inset: 0; }
.ba-pic svg { width: 100%; height: 100%; display: block; }
.ba-line { position: absolute; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: #fff; box-shadow: 0 0 12px #000a; pointer-events: none; }

button, .btn, .choice, .navbtn { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

<script>
/* ==== src/core/config.js ==== */
/* FN.Config — the one place for release settings.
   GAME_VERSION: bump for every release (also names the offline cache in site/sw.js).
   FEEDBACK_URL: tester feedback form; empty hides the button. "{version}" is replaced with GAME_VERSION. */
window.FN = window.FN || {};
FN.Config = { GAME_VERSION: '1.2.0', FEEDBACK_URL: 'https://docs.google.com/forms/d/e/1FAIpQLSeMfJSA9bnBxMd0RIuUCx_DInv1UQ72gbI_cjqecehSMzVLUw/viewform?usp=pp_url&entry.1490680224={version}' };

/* ==== src/core/rng.js ==== */
/* FN.RNG — seeded randomness. Player state keeps its own integer RNG state (s.rng) so
   outcomes are reproducible and reloading the page can never re-roll a result. */
window.FN = window.FN || {};
(function () {
  function step(a) {
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return { a: a, v: ((t ^ (t >>> 14)) >>> 0) / 4294967296 };
  }
  var R = {};
  // Advance the player's RNG and return 0..1
  R.next = function (s) {
    var r = step(s.rng | 0);
    s.rng = r.a;
    return r.v;
  };
  // Independent stream from a seed (used by the future simulator so it never touches s.rng)
  R.stream = function (seed) {
    var a = seed | 0;
    return function () { var r = step(a); a = r.a; return r.v; };
  };
  R.hash = function () {
    var h = 2166136261;
    for (var i = 0; i < arguments.length; i++) {
      var str = String(arguments[i]);
      for (var j = 0; j < str.length; j++) { h ^= str.charCodeAt(j); h = Math.imul(h, 16777619); }
      h ^= 0x9e37; h = Math.imul(h, 16777619);
    }
    return h | 0;
  };
  // Approximately normal(0,1)
  R.normal = function (rng) { return (rng() + rng() + rng() + rng() + rng() + rng() - 3) / 0.7071; };
  R.range = function (rng, a, b) { return a + (b - a) * rng(); };
  R.int = function (rng, a, b) { return a + Math.floor(rng() * (b - a + 1)); };
  R.pick = function (rng, arr) { return arr[Math.floor(rng() * arr.length)]; };
  // items: array; weightOf(item) -> number >= 0. Returns item or null.
  R.weighted = function (rng, items, weightOf) {
    var total = 0, ws = [];
    for (var i = 0; i < items.length; i++) { var w = Math.max(0, +weightOf(items[i]) || 0); ws.push(w); total += w; }
    if (total <= 0) return null;
    var x = rng() * total;

  };

    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rng() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  };
  FN.RNG = R;
})();

  // Backup file: format 2 adds the profile list. Format 1 files (players only) still import.
  S.exportAll = function () {
    var out = { game: 'FROM NOTHING', format: 2, version: FN.Config && FN.Config.GAME_VERSION, exported: new Date().toISOString(), profiles: S.profiles(), players: {} };
    S.ids().forEach(function (id) { var s = S.load(id); if (s) out.players[id] = s; });
    return JSON.stringify(out, null, 1);
  };
  // Returns {ok:true, imported:[ids]} or {ok:false, error}. Replaces only the players inside the file.
  S.importAll = function (text) {
    var data;
    try { data = JSON.parse(text); } catch (e) { return { ok: false, error: 'That file is not a valid save file.' }; }
    if (!data || data.game !== 'FROM NOTHING' || !isObj(data.players)) return { ok: false, error: 'That file is not a Penny to Plenty save file.' };
    var given = {};
    (Array.isArray(data.profiles) ? data.profiles : []).forEach(function (p) { if (p && S.validId(p.id)) given[p.id] = p; });
    var ready = [];
    var ids = Object.keys(data.players);
    for (var i = 0; i < ids.length; i++) {
      var id = ids[i];
      if (!S.validId(id)) continue;
      var p = S.migrate(data.players[id]);
      if (!p || p.id !== id) return { ok: false, error: 'One of the saves in that file looks damaged.' };
      ready.push(p);
    }
    if (!ready.length) return { ok: false, error: 'No player saves were found in that file.' };
    var imported = [];
    ready.forEach(function (p) {
      if (given[p.id]) { var list = S.profiles().filter(function (x) { return x.id !== p.id; }); list.push(given[p.id]); S.saveProfiles(list); }
      else S.ensureProfileFor(p);
      S.save(p); imported.push(p.id);
      if (FN.Cloud && FN.Cloud.ready) FN.Cloud.flush(p.id);
    });
    return { ok: true, imported: imported };
  };

  FN.State = S;
})();

/* ==== src/core/cloud.js ==== */
/* FN.Cloud — online save mirror, used only when the game runs as a published claude.ai page.
   Each viewer's saves go to their own private storage (data/users/<id>/save_<player>), so progress
   survives even if the browser's local storage is cleared. When the game is opened from a file,
   window.claude doesn't exist and this stays switched off: localStorage works exactly as before. */
window.FN = window.FN || {};
(function () {
  var Cl = { ready: false, db: null, uid: null, timers: {}, lastError: null };
  var S = function () { return FN.State; };

  Cl.available = function () { return !!(window.claude && typeof window.claude.use === 'function'); };
  Cl.ref = function (pid) { return Cl.db.collection('data/users/' + Cl.uid).doc(pid === 'profiles' ? 'profiles' : 'save_' + pid); };
  // 'profiles' is the player list; anything else is one player's save
  function localKey(pid) { return pid === 'profiles' ? S().PROFILES_KEY : S().key(pid); }
  function localUpdated(pid) {
    if (pid === 'profiles') return +(S().getRaw(S().PROFILES_KEY + '_updated') || 0);
    var l = S().load(pid); return l ? (l.updated || 0) : 0;
  }

  // Connect, then pull any newer saves from the account (or push local ones that the account lacks).
  // onLoaded(changedIds) runs after any save was replaced by a newer account copy.
  Cl.init = function (onLoaded) {
    if (!Cl.available()) return Promise.resolve(false);
    return Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db || !user) return false;
      return Promise.resolve(user.id()).then(function (uid) {
        if (!uid) return false;
        Cl.db = db; Cl.uid = uid; Cl.ready = true;
        var changed = [];
        function sync(pid) {
          return Cl.ref(pid).get().then(function (snap) {
            var d = snap.exists ? snap.data() : null, lu = localUpdated(pid), has = !!S().getRaw(localKey(pid));
            if (d && typeof d.json === 'string' && (!has || (d.updated || 0) > lu)) {
              S().setRaw(localKey(pid), d.json);
              if (pid === 'profiles') S().setRaw(S().PROFILES_KEY + '_updated', String(d.updated || 0));
              changed.push(pid);
            } else if (has && (!d || lu > (d.updated || 0))) return Cl.push(pid);
          });
        }
        // the player list first, then every player's save
        return sync('profiles').then(function () {
          // include the original two ids so saves from the earlier online version (before profiles) come back too
          var ids = S().ids(); Object.keys(S().LEGACY).forEach(function (id) { if (ids.indexOf(id) < 0) ids.push(id); });
          return ids.reduce(function (p, pid) { return p.then(function () { return sync(pid); }); }, Promise.resolve());
        }).then(function () {
          Object.keys(S().LEGACY).forEach(function (id) { var l = S().load(id); if (l) S().ensureProfileFor(l); });
        }).then(function () { if (changed.length && onLoaded) onLoaded(changed); return true; });
      });
    }).catch(function (e) { Cl.lastError = e; return false; });
  };

  Cl.push = function (pid) {
    if (!Cl.ready) return Promise.resolve({ ok: false, error: 'Not connected to your account.' });
    var raw = S().getRaw(localKey(pid));
    if (pid === 'profiles') return Cl.ref(pid).set({ json: raw || '[]', updated: localUpdated(pid) }).then(function () { return { ok: true }; }, function (e) { Cl.lastError = e; return { ok: false, error: 'Could not reach your account.' }; });
    if (!raw) return Cl.ref(pid).delete().then(function () { return { ok: true }; }, function () { return { ok: true }; });
    var updated = 0, day = 0;
    try { var o = JSON.parse(raw); updated = o.updated || 0; day = o.day || 0; } catch (e) { }
    return Cl.ref(pid).set({ json: raw, updated: updated, day: day }).then(function () {
      Cl.lastError = null; return { ok: true };
    }, function (e) {
      Cl.lastError = e; return { ok: false, error: (e && e.code === 'quota_exceeded') ? 'Your online storage is full.' : 'Could not reach your account (' + ((e && e.code) || 'error') + ').' };
    });
  };
  // Auto-save mirror: batch rapid saves into one write per player
  Cl.queue = function (pid) {
    if (!Cl.ready) return;
    clearTimeout(Cl.timers[pid]);
    Cl.timers[pid] = setTimeout(function () { delete Cl.timers[pid]; Cl.push(pid); }, 1500);
  };
  Cl.flush = function (pid) { clearTimeout(Cl.timers[pid]); delete Cl.timers[pid]; return Cl.push(pid); };
  Cl.flushAll = function () { Object.keys(Cl.timers).forEach(function (pid) { Cl.flush(pid); }); };
  Cl.remove = function (pid) { if (Cl.ready) Cl.ref(pid).delete().catch(function () { }); };

  if (typeof document !== 'undefined') document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') Cl.flushAll(); });
  FN.Cloud = Cl;
})();

/* ==== src/core/economy.js ==== */
/* FN.Economy — every money calculation in the game lives here.
   Net worth = cash + savings + assets - liabilities.  Profit = revenue - expenses. */
window.FN = window.FN || {};
(function () {
  var C = FN.Catalog, R = FN.RNG;
  var E = {};

  E.r2 = function (n) { return Math.round((+n || 0) * 100) / 100; };
  E.fmt = function (n) {
    n = E.r2(n);
    var neg = n < 0; n = Math.abs(n);
    var whole = Math.floor(n), cents = Math.round((n - whole) * 100);
    var str = whole.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    if (cents) str += '.' + (cents < 10 ? '0' : '') + cents;
    return (neg ? '-$' : '$') + str;
  };
  E.clamp = function (n, a, b) { return Math.max(a, Math.min(b, n)); };

  /* ---------- ledger & cash ---------- */
  E.todayRow = function (s) {
    var row = s.ledger[s.ledger.length - 1];
    if (!row || row.day !== s.day) { row = { day: s.day, income: 0, expenses: 0 }; s.ledger.push(row); if (s.ledger.length > 60) s.ledger.shift(); }
    return row;
  };
  E.log = function (s, text, amount) {
    s.history.push({ day: s.day, text: text, amount: amount === undefined ? null : E.r2(amount) });
    if (s.history.length > 150) s.history.shift();
  };
  // Money earned (income)
  E.earn = function (s, n, why) {
    n = E.r2(n); if (n <= 0) return 0;
    s.cash = E.r2(s.cash + n); s.stats.earned = E.r2(s.stats.earned + n);
    E.todayRow(s).income = E.r2(E.todayRow(s).income + n);
    if (why) E.log(s, why, n);
    return n;
  };
  // Money spent (expense). Returns false and changes nothing if not enough cash.
  E.spend = function (s, n, why) {
    n = E.r2(n); if (n <= 0) return true;
    if (s.cash + 1e-9 < n) return false;
    s.cash = E.r2(s.cash - n); s.stats.spent = E.r2(s.stats.spent + n);
    E.todayRow(s).expenses = E.r2(E.todayRow(s).expenses + n);
    if (why) E.log(s, why, -n);
    return true;
  };
  // Pay a bill: cash first, then savings. Returns amount actually paid.
  E.payBill = function (s, n, why) {
    n = E.r2(n); if (n <= 0) return 0;
    var fromCash = Math.min(s.cash, n);
    var fromSav = Math.min(s.savings, E.r2(n - fromCash));
    s.cash = E.r2(s.cash - fromCash); s.savings = E.r2(s.savings - fromSav);
    var paid = E.r2(fromCash + fromSav);
    s.stats.spent = E.r2(s.stats.spent + paid);
    E.todayRow(s).expenses = E.r2(E.todayRow(s).expenses + paid);
    if (why && paid > 0) E.log(s, why + (fromSav > 0 ? ' (savings covered ' + E.fmt(fromSav) + ')' : ''), -paid);
    return paid;
  };

  /* ---------- assets ---------- */
  E.itemValue = function (s, id) {
    var it = s.items[id], c = C.ITEMS[id];
    if (!it || !c) return 0;
    var price = it.price === undefined ? c.price : it.price;
    var weeks = Math.max(0, (s.day - (it.boughtDay || s.day)) / 7);
    return E.r2(price * Math.max(c.floor, 1 - c.drop - c.weekly * weeks));
  };
  E.homeValue = function (s) {
    if (!s.ownedHome) return 0;
    var weeks = Math.max(0, (s.day - s.ownedHome.day) / 7);
    return E.r2(s.ownedHome.price * Math.pow(1 + C.HOME_APPRECIATION_PER_WEEK, weeks));
  };
  E.inventoryValue = function (s) {
    var v = 0; Object.keys(s.inventory).forEach(function (g) { v += s.inventory[g].cost || 0; }); return E.r2(v);
  };
  // Equipment resale ~50% of what was invested; property (farm land, rental) keeps full value.
  E.bizValue = function (s, id) {
    var b = s.businesses[id]; if (!b) return 0;
    var keep = (id === 'rental' || id === 'market_farm') ? 1 : 0.5;
    return E.r2((b.invested || 0) * keep);
  };
  E.assetsBreakdown = function (s) {
    var items = 0; Object.keys(s.items).forEach(function (id) { items += E.itemValue(s, id); });
    var biz = 0; Object.keys(s.businesses).forEach(function (id) { biz += E.bizValue(s, id); });
    return { items: E.r2(items), home: E.homeValue(s), inventory: E.inventoryValue(s), business: E.r2(biz), investments: E.r2(s.investments.index.value) };
  };
  E.assets = function (s) { var a = E.assetsBreakdown(s); return E.r2(a.items + a.home + a.inventory + a.business + a.investments); };
  E.liabilities = function (s) { var d = 0; s.loans.forEach(function (l) { d += l.balance; }); return E.r2(d); };
  E.netWorth = function (s) { return E.r2(s.cash + s.savings + E.assets(s) - E.liabilities(s)); };

  /* ---------- bank ---------- */
  E.deposit = function (s, n) {
    n = E.r2(Math.min(n, s.cash)); if (n <= 0) return 0;
    s.cash = E.r2(s.cash - n); s.savings = E.r2(s.savings + n); E.log(s, 'Moved ' + E.fmt(n) + ' into savings'); return n;
  };
  E.withdraw = function (s, n) {
    n = E.r2(Math.min(n, s.savings)); if (n <= 0) return 0;
    s.savings = E.r2(s.savings - n); s.cash = E.r2(s.cash + n); E.log(s, 'Took ' + E.fmt(n) + ' out of savings'); return n;
  };
  E.weeklyPayment = function (amount, rate, weeks) {
    if (rate <= 0) return E.r2(amount / weeks);
    return E.r2(amount * rate / (1 - Math.pow(1 + rate, -weeks)));
  };
  E.takeLoan = function (s, offer) {
    var amount = E.r2(offer.amount);
    if (!(amount > 0)) return null;
    var loan = { id: 'L' + (++s.loanSeq), name: offer.name || 'Loan', principal: amount, balance: amount, rate: offer.rate, weeks: offer.weeks, payment: E.weeklyPayment(amount, offer.rate, offer.weeks), startDay: s.day };
    s.loans.push(loan);
    s.cash = E.r2(s.cash + amount); // borrowed money is not income
    s.stats.loansTaken++;
    E.log(s, 'Borrowed ' + E.fmt(amount) + ' (' + loan.name + ')', amount);
    return loan;
  };
  E.totalLoanCost = function (amount, rate, weeks) { return E.r2(E.weeklyPayment(amount, rate, weeks) * weeks); };
  E.repayLoan = function (s, loanId, amount) {
    var loan = s.loans.filter(function (l) { return l.id === loanId; })[0];
    if (!loan) return 0;
    amount = E.r2(Math.min(amount, loan.balance, s.cash)); if (amount <= 0) return 0;
    s.cash = E.r2(s.cash - amount); loan.balance = E.r2(loan.balance - amount);
    E.log(s, 'Paid ' + E.fmt(amount) + ' toward ' + loan.name, -amount);
    E.closePaidLoans(s);
    return amount;
  };
  E.closePaidLoans = function (s) {
    var before = s.loans.length;
    s.loans = s.loans.filter(function (l) { return l.balance > 0.004; });
    if (s.loans.length < before) { s.stats.loansRepaid += before - s.loans.length; s.achievements.debt_free = s.achievements.debt_free || s.day; }
  };
  E.invest = function (s, n) {
    n = E.r2(Math.min(n, s.cash)); if (n <= 0) return 0;
    s.cash = E.r2(s.cash - n); s.investments.index.value = E.r2(s.investments.index.value + n); s.investments.index.cost = E.r2(s.investments.index.cost + n);
    E.log(s, 'Invested ' + E.fmt(n) + ' in the Index Fund'); return n;
  };
  E.sellInvestment = function (s, n) {
    var inv = s.investments.index; n = E.r2(Math.min(n, inv.value)); if (n <= 0) return 0;
    var costPart = inv.value > 0 ? inv.cost * (n / inv.value) : 0;
    inv.value = E.r2(inv.value - n); inv.cost = E.r2(Math.max(0, inv.cost - costPart));
    if (inv.value < 0.01) { inv.value = 0; inv.cost = 0; }
    s.cash = E.r2(s.cash + n);
    E.log(s, 'Sold ' + E.fmt(n) + ' of the Index Fund'); return n;
  };
  E.donate = function (s, n, why) {
    n = E.r2(Math.min(n, s.cash)); if (n <= 0) return 0;
    s.cash = E.r2(s.cash - n); s.stats.donated = E.r2(s.stats.donated + n);
    E.todayRow(s).expenses = E.r2(E.todayRow(s).expenses + n);
    E.log(s, why || ('Donated ' + E.fmt(n)), -n);
    return n;
  };

  /* ---------- items & homes ---------- */
  E.buyItem = function (s, id, free) {
    var c = C.ITEMS[id]; if (!c || s.items[id]) return false;
    if (!free && !E.spend(s, c.price, 'Bought ' + c.name)) return false;
    s.items[id] = { boughtDay: s.day, price: free ? Math.round(c.price * 0.6) : c.price };
    return true;
  };
  E.sellItem = function (s, id) {
    if (!s.items[id]) return 0;
    var v = E.itemValue(s, id);
    delete s.items[id];
    s.cash = E.r2(s.cash + v);
    E.log(s, 'Sold ' + C.ITEMS[id].name + ' for ' + E.fmt(v), v);
    return v;
  };
  // Cost to move into a home right now (deposit for rentals, full price to buy)
  E.homeMoveCost = function (s, id) { var h = C.HOMES[id]; return h.price ? h.price : (h.deposit || 0); };
  E.moveHome = function (s, id) {
    var h = C.HOMES[id]; if (!h || s.home === id) return { ok: false, msg: 'You already live there.' };
    var sale = 0;
    if (s.ownedHome) sale = E.r2(E.homeValue(s) * 0.95); // selling the old home (5% selling fees)
    var cost = E.homeMoveCost(s, id);
    if (s.cash + sale + 1e-9 < cost) return { ok: false, msg: 'You need ' + E.fmt(cost) + ' to move there.' };
    if (s.ownedHome) { s.cash = E.r2(s.cash + sale); E.log(s, 'Sold your ' + C.HOMES[s.ownedHome.id].short + ' for ' + E.fmt(sale), sale); s.ownedHome = null; }
    if (h.price) {
      s.cash = E.r2(s.cash - cost); s.stats.spent = E.r2(s.stats.spent + cost);
      s.ownedHome = { id: id, price: cost, day: s.day };
      s.achievements.homeowner = s.achievements.homeowner || s.day;
      E.log(s, 'Bought the ' + h.name + '!', -cost);
    } else if (cost > 0) {
      E.spend(s, cost, 'Paid a deposit for the ' + h.name);
    }
    var oldLoc = s.location;
    s.home = id; s.location = h.location; s.place = 'home'; s.unpaidDays = 0;
    if (id !== 'tent') s.achievements.moved_up = s.achievements.moved_up || s.day;
    if (h.location === 'country') s.achievements.country_life = s.achievements.country_life || s.day;
    E.log(s, 'Moved into the ' + h.name);
    return { ok: true, movedRegion: oldLoc !== h.location };
  };
  E.dailyLiving = function (s) {
    var h = C.HOMES[s.home];
    return { rent: h.rent || 0, food: h.food || 0, upkeep: h.upkeep || 0 };
  };

  /* ---------- prices & goods ---------- */
  E.marketPrice = function (s, good) {
    var g = C.GOODS[good]; if (!g || !g.priceKey) return 0;
    return E.r2(s.economy.prices[g.priceKey] || C.BASE_PRICES[g.priceKey] || 0);
  };
  E.addInv = function (s, good, qty, cost) {
    qty = Math.max(0, Math.round(qty)); if (!qty) return;
    var it = s.inventory[good] || (s.inventory[good] = { qty: 0, cost: 0 });
    it.qty += qty; it.cost = E.r2(it.cost + (cost || 0));
  };
  // Removes qty units (never below zero); returns cost basis removed
  E.removeInv = function (s, good, qty) {
    var it = s.inventory[good]; if (!it || it.qty <= 0) return { qty: 0, cost: 0 };
    qty = Math.min(it.qty, Math.max(0, Math.round(qty)));
    var costPart = it.qty > 0 ? E.r2(it.cost * (qty / it.qty)) : 0;
    it.qty -= qty; it.cost = E.r2(it.cost - costPart);
    if (it.qty <= 0) delete s.inventory[good];
    return { qty: qty, cost: costPart };
  };
  E.sellGoods = function (s, good, qty, price, why) {
    var have = s.inventory[good] ? s.inventory[good].qty : 0;
    if (qty === 'all') qty = have;
    var r = E.removeInv(s, good, qty);
    if (!r.qty) return { qty: 0, revenue: 0, profit: 0 };
    var rev = E.r2(r.qty * price);
    E.earn(s, rev, why || ('Sold ' + r.qty + ' ' + (C.GOODS[good] ? C.GOODS[good].name.toLowerCase() : good) + ' for ' + E.fmt(rev)));
    return { qty: r.qty, revenue: rev, cost: r.cost, profit: E.r2(rev - r.cost) };
  };

  /* ---------- jobs ---------- */
  E.workShift = function (s, rng) {
    var j = C.JOBS[s.job]; if (!j) return null;
    var pay = j.wage;
    var bonus = 0;
    if (rng() < 0.08 + s.skills.people / 1000) bonus = Math.max(1, Math.round(j.wage * 0.25));
    E.earn(s, pay + bonus, 'Worked a shift as ' + j.title);
    s.jobShifts++;
    var gains = [];
    Object.keys(j.gain).forEach(function (k) { s.skills[k] = E.clamp(s.skills[k] + j.gain[k], 0, 100); gains.push(C.SKILLS[k].icon + ' +' + j.gain[k]); });
    if (j.place === 'grocery') s.rel.rosa = E.clamp(s.rel.rosa + 1, -100, 100);
    if (j.place === 'farm') s.rel.miller = E.clamp(s.rel.miller + 1, -100, 100);
    s.reputation = E.clamp(s.reputation + 0.5, 0, 100);
    return { pay: pay, bonus: bonus, gains: gains, title: j.title };
  };

  /* ---------- businesses ---------- */
  E.bizMult = function (s, id) { var b = s.businesses[id], c = C.BUSINESSES[id]; return c.levels[(b.level || 1) - 1].mult; };
  E.startBusiness = function (s, id, free) {
    var c = C.BUSINESSES[id]; if (!c || s.businesses[id]) return false;
    if (!free && !E.spend(s, c.startCost, 'Started a ' + c.name)) return false;
    s.businesses[id] = { level: 1, openedDay: s.day, units: 0, helper: false, invested: free ? 0 : c.startCost, totalRevenue: 0, totalExpenses: 0, daysRun: 0, recent: [], last: null, lastRunDay: 0 };
    s.achievements.first_business = s.achievements.first_business || s.day;
    if (Object.keys(s.businesses).length >= 2) s.achievements.two_biz = s.achievements.two_biz || s.day;
    if (id === 'rental') s.achievements.landlord = s.achievements.landlord || s.day;
    E.log(s, 'Opened: ' + c.name + '!');
    return true;
  };
  E.upgradeCost = function (s, id) { var b = s.businesses[id], c = C.BUSINESSES[id]; var nx = c.levels[b.level]; return nx ? nx.cost : null; };
  E.upgradeBusiness = function (s, id, free) {
    var b = s.businesses[id], c = C.BUSINESSES[id]; if (!b) return false;
    var nx = c.levels[b.level]; if (!nx) return false;
    if (!free && !E.spend(s, nx.cost, 'Upgraded ' + c.name + ' to ' + nx.name)) return false;
    b.level++; if (!free) b.invested = E.r2((b.invested || 0) + nx.cost);
    return true;
  };
  E.maxUnits = function (s, id) { var c = C.BUSINESSES[id], b = s.businesses[id]; return c.maxUnits ? c.maxUnits[(b ? b.level : 1) - 1] : 0; };
  E.addUnits = function (s, id, n, free) {
    var b = s.businesses[id], c = C.BUSINESSES[id]; if (!b || !c.perUnit) return 0;
    n = Math.min(n, E.maxUnits(s, id) - b.units); if (n <= 0) return 0;
    var cost = n * c.perUnit;
    if (!free && !E.spend(s, cost, 'Bought ' + n + ' more for the ' + c.name)) return 0;
    b.units += n; if (!free) b.invested = E.r2((b.invested || 0) + cost);
    return n;

/* FN.Milestones — the five milestones that unlock "SEE MY FUTURE".
   Progress is tracked from real gameplay and saved inside each player's own save (s.milestones).
   Anti-grinding rules:
     - Pressing Next Day or skipping never counts as a decision.
     - Everyday filler scenarios, quizzes and work shifts count as a decision at most once per day.
     - Repeated money actions of the same kind (e.g. many small deposits) count once per kind per day.

window.FN = window.FN || {};
(function () {
  var C = FN.Catalog;
  var M = {};

  M.DEFS = [
    { id: 'earn', icon: '💵', title: 'Earn Your First Money', desc: 'Complete 5 earning activities: odd jobs, work shifts, business days or selling goods.', target: 5 },
    { id: 'manage', icon: '🧮', title: 'Learn to Manage Money', desc: 'Make 10 money decisions: spend on purpose, save, budget, borrow, invest or give.', target: 10 },
    { id: 'independence', icon: '🏠', title: 'Build Your Independence', desc: 'Move out of the tent AND get steady income (3 work shifts, or run a business for 3 days).', target: 2 },
    { id: 'challenges', icon: '⛈️', title: 'Overcome Challenges', desc: 'Face 3 setbacks or surprises — bad weather days, losses, unexpected costs — and keep going.', target: 3 },
    { id: 'foundation', icon: '🧱', title: 'Build Your Foundation', desc: 'Reach day 30 and make 25 meaningful decisions.', target: 2 }
  ];
  M.NEED_DAYS = 30; M.NEED_DECISIONS = 25;

  function fresh(how) {
    return { v: M.VERSION, earnActs: 0, moneyDecisions: 0, challenges: 0, decisions: 0, housing: false, income: false,
      done: {}, unlocked: 0, celebrated: false, perDay: {}, origin: how || 'new' };
  }
  M.isFiller = function (sc) { return !!sc && (sc.filler || /^f_/.test(sc.id)); };

    m.perDay[k] = 1;

    s.milestones = brandNew ? fresh('new') : M.reconstruct(s);

  M.money = function (s, type, amount) {

  };

  M.hasIncome = function (s) {

      var b = s.businesses[k], c = C.BUSINESSES[k];

  };

  M.status = function (s) {
    var m = M.ensure(s);

      earn: { have: Math.min(m.earnActs, 5), text: Math.min(m.earnActs, 5) + ' / 5 earning activities' },
      manage: { have: Math.min(m.moneyDecisions, 10), text: Math.min(m.moneyDecisions, 10) + ' / 10 money decisions' },
      independence: { have: (m.housing ? 1 : 0) + (m.income ? 1 : 0), parts: [{ ok: m.housing, text: 'Better home than the tent' }, { ok: m.income, text: 'Steady income (job or business)' }] },
      challenges: { have: Math.min(m.challenges, 3), text: Math.min(m.challenges, 3) + ' / 3 challenges faced' },
      foundation: { have: (s.day >= M.NEED_DAYS ? 1 : 0) + (m.decisions >= M.NEED_DECISIONS ? 1 : 0), parts: [{ ok: s.day >= M.NEED_DAYS, text: 'Day ' + Math.min(s.day, M.NEED_DAYS) + ' / ' + M.NEED_DAYS }, { ok: m.decisions >= M.NEED_DECISIONS, text: Math.min(m.decisions, M.NEED_DECISIONS) + ' / ' + M.NEED_DECISIONS + ' meaningful decisions' }] }
    };

      var v = vals[d.id];
      var done = !!m.done[d.id] || v.have >= d.target;

    M.status(s).forEach(function (x) { if (x.done && !m.done[x.id]) { m.done[x.id] = s.day; out.completed.push(x.id); } });
    if (!m.unlocked && M.DEFS.every(function (d) { return m.done[d.id]; })) { m.unlocked = s.day; out.unlocked = true; }

  };

      if (!ef) return false;

      if (ef.spoil || ef.loseItem || ef.flag === 'hens_slow') return true;

       money      = distinct money actions per day found in the money history (deposits, investing, loans, buying...)

    ['loan', /^Borrowed /], ['repay', /^Paid .* toward /], ['donate', /^(Gave|Donated)/], ['buy', /^Bought /], ['sellitem', /^Sold .* for /],
    ['startbiz', /^(Opened:|Started a )/], ['upgrade', /^Upgraded /], ['move', /^Moved into /], ['hire', /^Hired /], ['supplies', /: bought .* supplies/]
  ];

    return m;
  };

})();

    likely: { name: 'Most Likely', icon: '🧭', growth: 0.035, skillGrowth: 0.04, biz: 0.05, ret: 0.05, vol: 0.10, shocks: 1, windfall: 0, creep: 0.4, desc: 'A reasonable path if you keep making choices like you do now.' },
    challenging: { name: 'Challenging Case', icon: '⛈️', growth: 0.01, skillGrowth: 0.02, biz: -0.02, ret: 0.01, vol: 0.14, shocks: 3, windfall: 0, creep: 0.45, desc: 'Unexpected expenses, weaker demand, and setbacks.' }
  };

      debt: E.liabilities(s), loans: s.loans.map(function (l) { return { balance: l.balance, rate: l.rate, payment: l.payment }; }),

  };

  F.project = function (s) {
    var inp = F.inputs(s);
    var seed = R.hash('future', s.seed, s.day, s.stats.decisions, Math.round(inp.netWorth));
    return {
      inputs: inp, seed: seed,
      cases: { best: F.projectCase(inp, 'best', seed), likely: F.projectCase(inp, 'likely', seed), challenging: F.projectCase(inp, 'challenging', seed) }
    };
  };

  // Explain what changed since the last time this player looked at their future.
  F.explain = function (prev, now) {
    if (!prev) return ['This is your first look at your future. Make more decisions and come back to see how it changes!'];
    var out = [], a = prev.inputs, b = now.inputs;
    var dNW = now.cases.likely.netWorth - prev.likelyNW;
    if (Math.abs(dNW) < 50) out.push('Your most likely future is about the same as last time (day ' + a.day + ').');
    else out.push('Since day ' + a.day + ', your most likely future net worth ' + (dNW > 0 ? 'went UP' : 'went DOWN') + ' by ' + E.fmt(Math.abs(dNW)) + '.');
    function cmp(label, x, y, good, money) {
      if (Math.abs(y - x) < (money ? 1 : 2)) return;
      var up = y > x;
      out.push((up === good ? '👍 ' : '⚠️ ') + label + ' ' + (up ? 'rose' : 'fell') + ' from ' + (money ? E.fmt(x) : Math.round(x)) + ' to ' + (money ? E.fmt(y) : Math.round(y)) + '.');
    }
    cmp('Your daily income', a.dailyIncome, b.dailyIncome, true, true);
    cmp('Your daily expenses', a.dailyExpenses, b.dailyExpenses, false, true);
    cmp('Your debt', a.debt, b.debt, false, true);
    cmp('Your savings + investments', a.savings + a.investments, b.savings + b.investments, true, true);
    cmp('Your average skill level', a.skillAvg, b.skillAvg, true, false);
    if (b.bizCount > a.bizCount) out.push('👍 You started a business, which can grow over time (but adds risk).');
    if (b.bizCount < a.bizCount) out.push('You have fewer businesses than before.');
    if (b.job !== a.job && b.job) out.push('👍 Your job changed to ' + C.JOBS[b.job].title + ' (' + E.fmt(b.wagePerShift) + ' per shift).');
    if (out.length === 1) out.push('Small changes add up over 10 years — keep going!');
    return out.slice(0, 6);
  };
  F.memoKey = function (id) { return 'fromnothing_future_' + id; };
  F.recall = function (id) { try { return JSON.parse(FN.State.getRaw(F.memoKey(id)) || 'null'); } catch (e) { return null; } };
  F.remember = function (id, proj) { FN.State.setRaw(F.memoKey(id), JSON.stringify({ inputs: proj.inputs, likelyNW: proj.cases.likely.netWorth, day: proj.inputs.day })); };

  FN.Future = F;
})();

/* ==== src/data/quizzes.js ==== */
/* FN.Quizzes — math & money challenge generators.
   gen(rng, level, s) -> {question, answers:[3], correct, explain:[3], lesson}
   Always use the seeded rng passed in (never Math.random). 'younger' = Adam (9), 'older' = Caleb (11). */
window.FN = window.FN || {};
(function () {
  function ri(rng, a, b) { return a + Math.floor(rng() * (b - a + 1)); }
  function pick(rng, arr) { return arr[Math.floor(rng() * arr.length)]; }
  function round2(n) { return Math.round(n * 100) / 100; }
  function money(n) {
    n = round2(n);
    var neg = n < 0; n = Math.abs(n);
    var whole = Math.floor(n), cents = Math.round((n - whole) * 100);
    var w = String(whole).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-$' : '$') + w + (cents ? '.' + (cents < 10 ? '0' : '') + cents : '');
  }
  function shuffle(rng, arr) {
    for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(rng() * (i + 1)); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
    return arr;
  }
  /* Build a 3-answer question. wrongs: [{v, why}] numeric distractors. fmt formats a value.
     Duplicates (same text as the correct answer or each other) are replaced with nearby values. */
  function build(rng, o) {
    var fmt = o.fmt || money;
    var items = [{ text: fmt(o.answer), why: 'Correct! ' + o.right, ok: true }];
    var seen = {}; seen[items[0].text] = 1;
    (o.wrongs || []).forEach(function (w) {
      if (items.length >= 3) return;
      if (w.v < 0 && !o.allowNeg) return;
      var t = fmt(w.v);
      if (seen[t]) return;
      seen[t] = 1; items.push({ text: t, why: w.why, ok: false });
    });
    var offs = [1, 2, -1, 3, -2, 5, 10, -3, 4, 7];
    var step = o.step || 1;
    for (var k = 0; items.length < 3 && k < offs.length; k++) {
      var v = round2(o.answer + offs[k] * step);
      if (v <= 0 && !o.allowNeg) continue;
      var t2 = fmt(v);
      if (seen[t2]) continue;
      seen[t2] = 1; items.push({ text: t2, why: 'Close, but not quite. Try working it out step by step.', ok: false });
    }
    shuffle(rng, items);
    var correct = 0;
    for (var i = 0; i < items.length; i++) if (items[i].ok) correct = i;
    return {
      question: o.question,
      answers: items.map(function (x) { return x.text; }),
      correct: correct,
      explain: items.map(function (x) { return x.why; }),
      lesson: o.lesson
    };
  }
  function choiceQ(rng, question, right, wrongs, lesson) {
    var items = [{ text: right.text, why: 'Correct! ' + right.why, ok: true }].concat(wrongs.map(function (w) { return { text: w.text, why: w.why, ok: false }; }));
    shuffle(rng, items);
    var c = 0; for (var i = 0; i < 3; i++) if (items[i].ok) c = i;
    return { question: question, answers: items.map(function (x) { return x.text; }), correct: c, explain: items.map(function (x) { return x.why; }), lesson: lesson };
  }
  var THINGS = ['a used toy', 'a book', 'a skateboard', 'a basket of apples', 'a birdhouse', 'a jar of honey'];

  FN.Quizzes = [
    { id: 'q_profit', topic: 'Profit', levels: ['younger', 'older'],
      gen: function (rng, level) {
        if (level === 'younger') {
          var x = ri(rng, 2, 15), y = x + ri(rng, 1, 15);
          return build(rng, {
            question: 'You bought ' + pick(rng, THINGS) + ' for ' + money(x) + ' and sold it for ' + money(y) + '. What is your profit?',
            answer: y - x,
            right: 'Profit = sell price minus cost: ' + money(y) + ' − ' + money(x) + ' = ' + money(y - x) + '.',
            wrongs: [{ v: x + y, why: 'That adds the two prices. Profit means you SUBTRACT what you paid.' },
                     { v: y, why: 'That is what you sold it for. You still have to take away what you paid.' }],
            lesson: 'Profit = money you get − money you spent.'
          });
        }
        var n = ri(rng, 3, 12), a = ri(rng, 2, 9), b = a + ri(rng, 1, 6);
        return build(rng, {
          question: 'You buy ' + n + ' birdhouses for ' + money(a) + ' each and sell them for ' + money(b) + ' each. What is your total profit?',
          answer: n * (b - a),
          right: 'Each one makes ' + money(b - a) + ', and ' + n + ' × ' + money(b - a) + ' = ' + money(n * (b - a)) + '.',
          wrongs: [{ v: b - a, why: 'That is the profit on just ONE birdhouse. Multiply by how many you sold.' },
                   { v: n * b, why: 'That is all your sales money. You forgot to subtract what you paid.' }],
          lesson: 'Total profit = profit per item × number of items.'
        });
      } },

    { id: 'q_change', topic: 'Making change', levels: ['younger', 'older'],
      gen: function (rng, level) {
        var p, q;
        if (level === 'younger') { p = ri(rng, 1, 19); q = 20; }
        else { p = ri(rng, 11, 89) + pick(rng, [0, 0.25, 0.5, 0.75]); q = 100; }
        var ans = round2(q - p);
        return build(rng, {
          question: 'A snack costs ' + money(p) + '. You pay with ' + money(q) + '. How much change should you get?',
          answer: ans,
          right: money(q) + ' − ' + money(p) + ' = ' + money(ans) + '. You can check by adding: ' + money(p) + ' + ' + money(ans) + ' = ' + money(q) + '.',
          wrongs: [{ v: ans + 1, why: 'Off by $1. Count up from the price to check.' },
                   { v: level === 'younger' ? p : ans - 10, why: level === 'younger' ? 'That is the price, not the change.' : 'Off by $10. Be careful when you borrow from the tens.' }],
          lesson: 'Always count your change. Mistakes happen!'
        });
      } },

    { id: 'q_multiply', topic: 'Price × quantity', levels: ['younger', 'older'],
      gen: function (rng, level) {
        var n = level === 'younger' ? ri(rng, 2, 9) : ri(rng, 6, 25);
        var p = level === 'younger' ? ri(rng, 1, 5) : ri(rng, 2, 12);
        return build(rng, {
          question: 'You sell ' + n + ' cups of lemonade for ' + money(p) + ' each. How much money do you make?',
          answer: n * p,
          right: n + ' × ' + money(p) + ' = ' + money(n * p) + '.',
          wrongs: [{ v: n + p, why: 'That adds the numbers. When every cup costs the same, you multiply.' },
                   { v: n * p + p, why: 'That counts one extra cup. Check your multiplication.' }],
          lesson: 'Total = number sold × price of each one.'
        });
      } },

    { id: 'q_savings_days', topic: 'Savings goal', levels: ['younger', 'older'],
      gen: function (rng, level) {
        var m = level === 'younger' ? ri(rng, 2, 5) : ri(rng, 3, 12);
        var d = level === 'younger' ? ri(rng, 3, 9) : ri(rng, 5, 15);
        var g = m * d;
        return build(rng, {
          question: 'You save ' + money(m) + ' every day. How many days until you have ' + money(g) + '?',
          answer: d, fmt: function (v) { return v + ' days'; },
          right: money(g) + ' ÷ ' + money(m) + ' = ' + d + ' days.',
          wrongs: [{ v: d + 1, why: 'One day too many. ' + d + ' × ' + money(m) + ' already reaches ' + money(g) + '.' },
                   { v: d - 1, why: 'Not enough days: ' + (d - 1) + ' × ' + money(m) + ' = ' + money((d - 1) * m) + '.' }],
          lesson: 'Days to save = goal ÷ amount saved each day.'
        });
      } },

    { id: 'q_discount', topic: 'Percent discounts', levels: ['older'],
      gen: function (rng) {
        var p = pick(rng, [20, 40, 60, 80, 120, 140, 160, 200]), x = pick(rng, [10, 20, 25, 50]);
        var off = p * x / 100, ans = p - off;
        return build(rng, {
          question: 'A bike helmet costs ' + money(p) + '. It is ' + x + '% off today. What is the sale price?',
          answer: ans,
          right: x + '% of ' + money(p) + ' is ' + money(off) + ', and ' + money(p) + ' − ' + money(off) + ' = ' + money(ans) + '.',
          wrongs: [{ v: off, why: 'That is how much you SAVE. Subtract it from the price.' },
                   { v: p - x, why: x + '% is not the same as $' + x + '. Find ' + x + '% of the price first.' }],
          lesson: 'Sale price = price − (percent × price).'
        });
      } },

    { id: 'q_budget', topic: 'Budgeting', levels: ['younger', 'older'],
      gen: function (rng, level) {
        if (level === 'younger') {
          var inc = ri(rng, 20, 40), f = ri(rng, 3, 10), r = ri(rng, 3, 10);
          return build(rng, {
            question: 'You earn ' + money(inc) + ' this week. You spend ' + money(f) + ' on food and ' + money(r) + ' on rent. How much is left?',
            answer: inc - f - r,
            right: money(inc) + ' − ' + money(f) + ' − ' + money(r) + ' = ' + money(inc - f - r) + '.',
            wrongs: [{ v: inc - f, why: 'You forgot to take away the rent.' },
                     { v: f + r, why: 'That is how much you spent, not how much is left.' }],
            lesson: 'Money left = money in − money out.'
          });
        }
        var I = ri(rng, 20, 30) * 10, a = ri(rng, 20, 60), b = ri(rng, 30, 90), c = ri(rng, 10, 30);
        return build(rng, {
          question: 'You earn ' + money(I) + ' a week. You spend ' + money(a) + ' on food, ' + money(b) + ' on rent and ' + money(c) + ' on fun. How much can you save?',
          answer: I - a - b - c,
          right: money(I) + ' − ' + money(a) + ' − ' + money(b) + ' − ' + money(c) + ' = ' + money(I - a - b - c) + '.',
          wrongs: [{ v: I - a - b, why: 'You forgot to subtract the fun money.' },
                   { v: a + b + c, why: 'That is your total spending, not what is left.' }],
          lesson: 'A budget shows what you can save after all your costs.'
        });
      } },

    { id: 'q_unit_price', topic: 'Unit price', levels: ['younger', 'older'],
      gen: function (rng, level) {
        var n1, n2, u1, u2, item = level === 'younger' ? 'apples' : 'eggs';
        if (level === 'younger') {
          n1 = pick(rng, [2, 3, 4, 5]); do { n2 = pick(rng, [2, 3, 4, 5]); } while (n2 === n1);
          u1 = ri(rng, 1, 4); do { u2 = ri(rng, 1, 4); } while (u2 === u1);
        } else {
          n1 = pick(rng, [6, 10, 12]); do { n2 = pick(rng, [6, 10, 12, 18]); } while (n2 === n1);
          u1 = pick(rng, [0.25, 0.3, 0.4, 0.5, 0.6, 0.75]); do { u2 = pick(rng, [0.25, 0.3, 0.4, 0.5, 0.6, 0.75]); } while (u2 === u1);
        }
        var p1 = round2(n1 * u1), p2 = round2(n2 * u2);
        var aWins = u1 < u2;
        var expl = 'Pack A is ' + money(u1) + ' per ' + item.slice(0, -1) + ' and Pack B is ' + money(u2) + '.';
        return choiceQ(rng,
          'Pack A: ' + n1 + ' ' + item + ' for ' + money(p1) + '. Pack B: ' + n2 + ' ' + item + ' for ' + money(p2) + '. Which is cheaper per ' + item.slice(0, -1) + '?',
          { text: aWins ? 'Pack A' : 'Pack B', why: expl },
          [{ text: aWins ? 'Pack B' : 'Pack A', why: 'Divide price by how many you get. ' + expl },
           { text: 'They cost the same', why: 'Not quite. ' + expl }],
          'Unit price = total price ÷ number of items. Lower is a better deal.');
      } },

    { id: 'q_net_worth', topic: 'Net worth', levels: ['younger', 'older'],
      gen: function (rng, level) {
        var c, sv, b, d;
        if (level === 'younger') { c = ri(rng, 2, 12); sv = ri(rng, 2, 12); b = ri(rng, 8, 20); d = ri(rng, 1, 7); }
        else { c = ri(rng, 20, 300); sv = ri(rng, 50, 500); b = ri(rng, 100, 900); d = ri(rng, 50, 150); }
        var nw = c + sv + b - d;
        return build(rng, {
          question: 'You have ' + money(c) + ' cash, ' + money(sv) + ' in savings, and a bike worth ' + money(b) + '. You owe ' + money(d) + '. What is your net worth?',
          answer: nw,
          right: money(c) + ' + ' + money(sv) + ' + ' + money(b) + ' − ' + money(d) + ' = ' + money(nw) + '.',
          wrongs: [{ v: c + sv + b + d, why: 'Money you OWE gets subtracted, not added.' },
                   { v: c + sv, why: 'Things you own, like the bike, count too. And subtract what you owe.' }],
          lesson: 'Net worth = everything you own − everything you owe.'
        });
      } },

    { id: 'q_loan_interest', topic: 'Loan interest', levels: ['older'],
      gen: function (rng) {
        var a = ri(rng, 1, 10) * 100, r = ri(rng, 1, 3), w = ri(rng, 2, 8);
        var wk = a * r / 100, tot = wk * w;
        return build(rng, {
          question: 'You borrow ' + money(a) + '. The bank charges ' + r + '% interest each week (on the starting amount). How much interest after ' + w + ' weeks?',
          answer: tot,
          right: r + '% of ' + money(a) + ' is ' + money(wk) + ' per week, × ' + w + ' weeks = ' + money(tot) + '.',
          wrongs: [{ v: wk, why: 'That is just ONE week of interest. Multiply by the number of weeks.' },
                   { v: a + tot, why: 'That is the total you pay back (loan + interest). The question asks only for interest.' }],
          lesson: 'Interest is the cost of borrowing. Longer loans cost more.'
        });
      } },

    { id: 'q_doubling', topic: 'Doubling & patience', levels: ['younger', 'older'],
      gen: function (rng, level) {
        var n = level === 'younger' ? ri(rng, 3, 6) : ri(rng, 7, 11);
        var ans = Math.pow(2, n - 1);
        return build(rng, {
          question: 'Your money doubles every day. You start with $1 on day 1. How much do you have on day ' + n + '?',
          answer: ans,
          right: 'Double it each day: $1, $2, $4, $8 … so day ' + n + ' is ' + money(ans) + '.',
          wrongs: [{ v: ans * 2, why: 'That is one doubling too many. Day 1 starts at $1.' },
                   { v: n, why: 'Adding $1 each day is not doubling. Doubling means × 2.' }],
          lesson: 'Things that keep doubling grow super fast. Patience pays!'
        });
      } },

    { id: 'q_break_even', topic: 'Break-even', levels: ['older'],
      gen: function (rng) {
        var p = pick(rng, [0.5, 1, 2, 5]), k = ri(rng, 5, 30), f = round2(p * k);
        return build(rng, {
          question: 'Your stand cost ' + money(f) + ' to start. You make ' + money(p) + ' profit on each cup. How many cups until you earn back the start cost?',
          answer: k, fmt: function (v) { return v + ' cups'; },
          right: money(f) + ' ÷ ' + money(p) + ' = ' + k + ' cups. After that, it is all profit!',
          wrongs: [{ v: f, why: 'That is the dollar amount. Divide it by the profit per cup.' },
                   { v: k * 2, why: 'Too many. Check: ' + k + ' × ' + money(p) + ' = ' + money(f) + '.' }],
          lesson: 'Break-even = start cost ÷ profit per item.'
        });
      } },

    { id: 'q_needs_wants', topic: 'Needs vs wants', levels: ['younger', 'older'],
      gen: function (rng) {
        var needs = ['Food for dinner', 'A warm winter coat', 'A safe place to sleep', 'Medicine when sick', 'Shoes that fit', 'Clean water'];
        var wants = ['A new video game', 'Candy', 'A toy robot', 'Fancy sneakers', 'Movie tickets', 'A light-up spinner'];
        var askNeed = rng() < 0.5;
        var right = pick(rng, askNeed ? needs : wants);
        var pool = (askNeed ? wants : needs).slice();
        shuffle(rng, pool);
        return choiceQ(rng,
          askNeed ? 'Which one is a NEED?' : 'Which one is a WANT?',
          { text: right, why: askNeed ? 'You need it to be safe and healthy.' : 'It is fun, but you can live without it.' },
          [{ text: pool[0], why: askNeed ? 'That is a want. Nice to have, but not needed to live.' : 'That is a need. You need it to be safe and healthy.' },
           { text: pool[1], why: askNeed ? 'That is a want. Nice to have, but not needed to live.' : 'That is a need. You need it to be safe and healthy.' }],
          'Pay for needs first. Then save. Then enjoy some wants.');
      } },

    { id: 'q_wages', topic: 'Hourly pay', levels: ['younger', 'older'],
      gen: function (rng, level) {
        if (level === 'younger') {
          var w = ri(rng, 2, 5), h = ri(rng, 2, 6);
          return build(rng, {
            question: 'You earn ' + money(w) + ' per hour helping at a store. You work ' + h + ' hours. How much do you earn?',
            answer: w * h,
            right: money(w) + ' × ' + h + ' hours = ' + money(w * h) + '.',
            wrongs: [{ v: w + h, why: 'That adds them. You get ' + money(w) + ' for EACH hour, so multiply.' },
                     { v: w * h - w, why: 'That is one hour short. Count all ' + h + ' hours.' }],
            lesson: 'Pay = hourly wage × hours worked.'
          });
        }
        var sh = pick(rng, [2, 3, 4, 5, 6, 8]), pw = ri(rng, 3, 12), t = sh * pw;
        return build(rng, {
          question: 'A shift pays ' + money(t) + ' for ' + sh + ' hours of work. How much is that per hour?',
          answer: pw,
          right: money(t) + ' ÷ ' + sh + ' hours = ' + money(pw) + ' per hour.',
          wrongs: [{ v: t - sh, why: 'That subtracts. To find pay per hour, divide by the hours.' },
                   { v: pw + 2, why: 'Too much. Check: ' + sh + ' × ' + money(pw) + ' = ' + money(t) + '.' }],
          lesson: 'Comparing hourly pay helps you pick the better job.'
        });
      } },

    { id: 'q_savings_interest', topic: 'Savings interest', levels: ['older'],
      gen: function (rng) {
        var sv = pick(rng, [100, 200, 300, 400, 500, 1000]), r = pick(rng, [2, 5, 10]);
        var it = sv * r / 100;
        return build(rng, {
          question: 'You keep ' + money(sv) + ' in a savings account that pays ' + r + '% interest per year. How much interest do you earn in one year?',
          answer: it,
          right: r + '% of ' + money(sv) + ' = ' + money(it) + '. The bank pays you for saving!',
          wrongs: [{ v: sv + it, why: 'That is your new total balance. The interest is just the extra part.' },
                   { v: r * 10, why: r + '% means ' + r + ' out of every 100. Multiply ' + money(sv) + ' by ' + r + '/100.' }],
          lesson: 'Interest on savings is money your money earns.'

/* FN.Effects — visual feedback layer: scene cross-fades, the sleep sequence between days,
   floating money, a ticking cash counter, confetti, mouse parallax and scene hotspots.

window.FN = window.FN || {};
(function () {

    var old = box.lastElementChild;
    var wrap = document.createElement('div');
    wrap.className = 'scene-layer scene-in ' + (mode === 'travel' ? 'travel' : 'fade');
    wrap.innerHTML = svg;
    var oldWrap = document.createElement('div');
    oldWrap.className = 'scene-layer scene-out ' + (mode === 'travel' ? 'travel' : 'fade');
    // keep only the newest outgoing layer
    Array.prototype.slice.call(box.querySelectorAll('.scene-out')).forEach(function (n) { n.remove(); });
    oldWrap = old; oldWrap.className = 'scene-layer scene-out ' + (mode === 'travel' ? 'travel' : 'fade');
    box.appendChild(wrap);
    setTimeout(function () { if (oldWrap.parentNode) oldWrap.remove(); }, 900);
    X.bindParallax(box); X.bindHotspots(box);
  };

  /* ---------- parallax ---------- */
  var px = { tx: 0, ty: 0, cx: 0, cy: 0, raf: 0, box: null };
  function tick() {
    px.raf = 0;
    px.cx += (px.tx - px.cx) * 0.12; px.cy += (px.ty - px.cy) * 0.12;
    if (px.box) {
      var layers = px.box.querySelectorAll('.scene-layer:not(.scene-out) .pl');
      for (var i = 0; i < layers.length; i++) {
        var d = +layers[i].getAttribute('data-depth') || 0;
        layers[i].style.transform = 'translate(' + (px.cx * d * 34).toFixed(2) + 'px,' + (px.cy * d * 8).toFixed(2) + 'px)';
      }
    }
    if (Math.abs(px.tx - px.cx) > 0.002 || Math.abs(px.ty - px.cy) > 0.002) px.raf = requestAnimationFrame(tick);
  }

    px.box = box;
    if (box._pxBound) { if (!px.raf) px.raf = requestAnimationFrame(tick); return; }
    box._pxBound = true;
    box.parentNode.addEventListener('mousemove', function (e) {
      var r = box.getBoundingClientRect();
      px.tx = -((e.clientX - r.left) / r.width - 0.5) * 2;
      px.ty = -((e.clientY - r.top) / r.height - 0.5) * 2;
      if (!px.raf) px.raf = requestAnimationFrame(tick);

  };

    if (box._hsBound) return; box._hsBound = true;

      var h = e.target.closest && e.target.closest('[data-hotspot]');
      if (!tip) { tip = document.createElement('div'); tip.className = 'hs-tip'; document.body.appendChild(tip); }
      if (!h) { tip.style.display = 'none'; box.classList.remove('hs-hover'); return; }

  /* ---------------- future screen ---------------- */
  function chartSvg(proj, inp) {
    var keys = ['best', 'likely', 'challenging'], colors = { best: '#39c27a', likely: '#4ea1ff', challenging: '#ff8a5c' };
    var all = [inp.netWorth]; keys.forEach(function (k) { proj.cases[k].years.forEach(function (y) { all.push(y.netWorth); }); });
    var mx = Math.max.apply(null, all), mn = Math.min(0, Math.min.apply(null, all));
    var W = 900, H = 260, L = 80, B = 30, T = 14;
    function X(i) { return L + i * (W - L - 20) / 10; } function Y(v) { return T + (H - T - B) * (1 - (v - mn) / Math.max(1, mx - mn)); }
    var g = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" font-family="system-ui" font-size="13">';
    for (var i = 0; i <= 4; i++) { var v = mn + (mx - mn) * i / 4; g += '<line x1="' + L + '" x2="' + (W - 20) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="#ffffff22"/><text x="' + (L - 8) + '" y="' + (Y(v) + 4) + '" fill="#a9b6c9" text-anchor="end">' + fmt(Math.round(v)) + '</text>'; }
    for (var a = 0; a <= 10; a += 2) g += '<text x="' + X(a) + '" y="' + (H - 8) + '" fill="#a9b6c9" text-anchor="middle">Age ' + (inp.age + a) + '</text>';
    keys.forEach(function (k) {
      var pts = [X(0) + ',' + Y(inp.netWorth)].concat(proj.cases[k].years.map(function (y, i) { return X(i + 1) + ',' + Y(y.netWorth); }));
      g += '<polyline fill="none" stroke="' + colors[k] + '" stroke-width="' + (k === 'likely' ? 4 : 2.5) + '" points="' + pts.join(' ') + '"' + (k === 'likely' ? '' : ' stroke-dasharray="7 5"') + '/>';
    });
    return g + '</svg>';
  }
  function renderFuture() {
    var s = A.s;
    var proj = F.project(s);

<script>
FN.App.init();
/* Web build only (site/index.html): offline install + "New version available" banner.
   Never runs from file:// — the double-click game stays exactly as before. */
(function () {
  if (!/^http/.test(location.protocol) || !('serviceWorker' in navigator)) return;
  var reloading = false;
  function offer(worker) {
    if (document.getElementById('updateBanner')) return;
    var b = document.createElement('button');
    b.id = 'updateBanner'; b.className = 'update-banner';
    b.textContent = '✨ New version available - Tap to update';
    b.onclick = function () { b.textContent = 'Updating…'; worker.postMessage('skipWaiting'); };
    document.body.appendChild(b);
  }
  navigator.serviceWorker.addEventListener('controllerchange', function () { if (!reloading) { reloading = true; location.reload(); } });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener('updatefound', function () {
        var w = reg.installing;
        if (w) w.addEventListener('statechange', function () { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
      });
      document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') reg.update().catch(function () { }); });
    }).catch(function () { });
  });
})();

</script>
